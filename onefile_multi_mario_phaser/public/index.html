<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>버섯 어드벤처 — Phaser</title>
  <link rel="stylesheet" href="../src/ui/lobby.css" />
  <style>
  html, body { margin: 0; height: 100%; background: #1a1a2e; overflow: hidden; color: #eee; font-family: "Segoe UI", sans-serif; }
  #gameShell { display: flex; flex-direction: column; height: 100dvh; }
  #topBar { flex-shrink: 0; text-align: center; padding: 6px 10px; }
  #topBar h1 { margin: 0; font-size: 1.1rem; background: linear-gradient(90deg, #ef4444, #fbbf24); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  #info { font-size: 0.75rem; color: #94a3b8; margin-top: 4px; }
  #hud { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 14px; font-size: 0.78rem; margin-top: 4px; }
  #playerTags { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 8px; margin-top: 4px; font-size: 0.75rem; }
  .ptag { padding: 1px 6px; border-radius: 6px; background: rgba(30,30,50,0.85); border: 1px solid transparent; }
  .ptag.me { border-color: #fbbf24; color: #fbbf24; }
  .ptag.dead { opacity: 0.35; text-decoration: line-through; }
  #stage { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; padding: 0 8px; }
  #app { display: flex; align-items: center; justify-content: center; position: relative; }
  #app canvas.mario-surface {
    position: relative;
    z-index: 1;
    border: 2px solid #334155;
    border-radius: 8px;
    max-width: 100%;
    height: auto;
  }
  #app canvas:not(.mario-surface) {
    position: absolute !important;
    inset: 0;
    margin: auto;
    opacity: 0;
    pointer-events: none;
    z-index: 0;
  }
  #backBtn { position: absolute; top: 6px; right: 6px; z-index: 5; }
  #controls { flex-shrink: 0; display: flex; justify-content: center; gap: 12px; padding: 10px 16px max(14px, env(safe-area-inset-bottom)); }
  .ctrl-btn { min-width: 64px; height: 56px; border-radius: 14px; border: 2px solid #fbbf24; background: rgba(251,191,36,0.12); color: #fbbf24; font-size: 1rem; cursor: pointer; touch-action: none; }
  .ctrl-btn.active { background: #fbbf24; color: #1a1a2e; }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.82); display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 40; text-align: center; padding: 20px; }
  #overlay.show { display: flex; }
  #restartBtn { margin-top: 12px; padding: 10px 24px; background: #fbbf24; color: #1a1a2e; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
  .lobby-btn { border: none; border-radius: 8px; padding: 10px 14px; font-size: 0.85rem; cursor: pointer; }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-green { background: #059669; color: #fff; }
  .btn-red { background: #dc2626; color: #fff; }
  .btn-yellow { background: #ca8a04; color: #fff; }
  .btn-ghost { background: #334155; color: #ddd; }
  .mode-block { background: #16213e; border: 1px solid #334155; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .mode-block h2 { margin: 0 0 8px; font-size: 1rem; color: #7ec8e3; }
  .mode-block p { margin: 0 0 10px; font-size: 0.78rem; color: #888; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
  #lobby { min-height: 100dvh; padding: 16px; max-width: 520px; margin: 0 auto; overflow-y: auto; }
  #lobby h1 { font-size: 1.35rem; }
  #lobby .sub { color: #94a3b8; font-size: 0.85rem; }
  #lobby .hint { background: #16213e; border: 1px solid #334; border-radius: 10px; padding: 12px; font-size: 0.82rem; color: #bbb; margin: 10px 0; }
  #lobby input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #445; background: #1a1a2e; color: #eee; }
  #roomBox, #waitingBox { background: #0f3460; padding: 12px; border-radius: 8px; border: 1px solid #2563eb; margin-top: 10px; font-size: 0.82rem; }
  #netLog { font-size: 0.75rem; color: #4ade80; max-height: 80px; overflow-y: auto; white-space: pre-wrap; margin-top: 8px; }
  #rosterList { list-style: none; padding: 0; margin: 8px 0; line-height: 1.8; }
  #rosterList .empty { color: #666; font-style: italic; }
  .invite-share-box { text-align: center; margin: 10px 0; }
  .invite-share-box canvas { border-radius: 8px; background: #fff; padding: 6px; }
  </style>
</head>
<body>
  <div id="lobby">
    <h1>🍄 버섯 어드벤처 (Phaser)</h1>
    <p class="sub">실시간 횡스크롤 · 2~4인 P2P 협동</p>
    <div class="hint">
      <strong>조작:</strong> ← → 이동 · 스페이스 점프(2단!) · ↓ 불/얼음 · 파이프+↓ 지하
    </div>
    <div class="mode-block">
      <h2>① 솔로</h2>
      <p>혼자 보스까지 클리어</p>
      <button class="lobby-btn btn-green" id="btnSolo">솔로 시작</button>
    </div>
    <div class="mode-block">
      <h2>② 협동 (2~4인)</h2>
      <button class="lobby-btn btn-primary" id="btnCoopHost">방 만들기</button>
    </div>
    <div class="mode-block" id="joinPanel">
      <h2>친구 방 참가</h2>
      <input id="joinCodeInput" type="text" placeholder="방 코드" autocomplete="off" />
      <div class="btn-row" style="margin-top:8px">
        <button class="lobby-btn btn-red" id="btnJoin">참가</button>
      </div>
    </div>
    <div id="waitingBox" class="hidden">
      <div id="waitingTitle">대기실</div>
      <div class="invite-share-box">
        <canvas id="inviteQr" width="176" height="176"></canvas>
        <p id="inviteCodeText" class="invite-code-text"></p>
      </div>
      <a id="inviteLink" href="#" rel="noopener"></a>
      <ul id="rosterList"></ul>
      <div class="btn-row">
        <button class="lobby-btn btn-yellow" id="btnCopyLink">초대 링크 복사</button>
        <button class="lobby-btn btn-green hidden" id="btnStartGame" disabled>게임 시작</button>
        <button class="lobby-btn btn-ghost" id="btnCancelWait">나가기</button>
      </div>
      <p id="guestWaitHint" class="hidden" style="font-size:0.78rem;color:#888">방장 시작 대기…</p>
    </div>
    <input id="roomInput" type="hidden" />
    <div id="roomBox" class="hidden">Peer: <b id="roomCode">—</b></div>
    <div id="netLog"></div>
  </div>

  <div id="gameShell" class="hidden">
    <div id="topBar">
      <h1>🍄 버섯 어드벤처</h1>
      <div id="info">← → · 점프 · ↓ 공격 · 파이프+↓</div>
      <div id="hud">
        <div>코인: <span id="coins">0</span></div>
        <div>불꽃: <span id="fireballsAmmo">0</span> · ❄️ <span id="iceAmmo">0</span></div>
        <div>상태: <span id="status">작음</span> · 🪶 <span id="featherTime">-</span></div>
        <div>보스: <span id="bossHp">-</span></div>
      </div>
      <div id="playerTags"></div>
    </div>
    <div id="stage">
      <button type="button" id="backBtn" class="btn-ghost">← 로비</button>
      <div id="app"></div>
    </div>
    <div id="controls">
      <button id="btnLeft" class="ctrl-btn">◀</button>
      <button id="btnDown" class="ctrl-btn">▼</button>
      <button id="btnJump" class="ctrl-btn">점프</button>
      <button id="btnRight" class="ctrl-btn">▶</button>
    </div>
    <div id="overlay">
      <h2 id="overlayTitle">게임 오버</h2>
      <p id="overlayMsg"></p>
      <button id="restartBtn">다시 시작</button>
      <button id="btnToLobby" class="lobby-btn btn-ghost" style="margin-top:10px">로비로</button>
    </div>
  </div>

  <script type="module" src="../src/main.js"></script>
</body>
</html>
