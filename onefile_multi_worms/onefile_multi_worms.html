<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지렁이 게임</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
      overflow: hidden;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #4ade80, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    #info {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 10px;
      text-align: center;
      line-height: 1.5;
    }
    #hud {
      display: flex;
      gap: 24px;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }
    #hud span { color: #4ade80; font-weight: bold; }
    canvas {
      border: 2px solid #334155;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(74, 222, 128, 0.15);
    }
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 10;
    }
    #overlay.show { display: flex; }
    #overlay h2 { font-size: 2rem; margin-bottom: 12px; }
    #overlay p { color: #94a3b8; margin-bottom: 20px; }
    #restartBtn {
      padding: 12px 32px;
      font-size: 1rem;
      background: #4ade80;
      color: #1a1a2e;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    #restartBtn:hover { background: #22c55e; }
    #gameWrap {
      position: relative;
    }
    #controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 14px;
    }
    .ctrl-btn {
      width: 72px;
      height: 72px;
      font-size: 1.8rem;
      background: rgba(74, 222, 128, 0.15);
      color: #4ade80;
      border: 2px solid #4ade80;
      border-radius: 16px;
      cursor: pointer;
      user-select: none;
      touch-action: none;
      transition: background 0.1s, transform 0.1s;
    }
    .ctrl-btn:hover { background: rgba(74, 222, 128, 0.25); }
    .ctrl-btn.active {
      background: #4ade80;
      color: #1a1a2e;
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <h1>🐛 지렁이 게임</h1>
  <div id="info">← → 방향키 또는 버튼으로 좌우 회전 · 5초마다 새 지렁이 등장 · 사과를 먹으면 길어짐</div>
  <div id="hud">
    <div>길이: <span id="length">3</span></div>
    <div>사과: <span id="apples">0</span></div>
    <div>생존: <span id="alive">3</span></div>
  </div>
  <div id="gameWrap">
    <canvas id="game" width="900" height="600"></canvas>
  </div>
  <div id="controls">
    <button id="btnLeft" class="ctrl-btn" aria-label="왼쪽">◀</button>
    <button id="btnRight" class="ctrl-btn" aria-label="오른쪽">▶</button>
  </div>

  <div id="overlay">
    <h2 id="overlayTitle">게임 오버</h2>
    <p id="overlayMsg">다시 도전해보세요!</p>
    <button id="restartBtn">다시 시작</button>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    const SEGMENT_DIST = 10;
    const HEAD_RADIUS = 9;
    const BODY_RADIUS = 7;
    const BASE_SPEED = 2.2;
    const TURN_SPEED = 0.08;
    const APPLE_COUNT = 25;
    const INITIAL_WORMS = 3;
    const SPAWN_INTERVAL_MS = 5000;
    const COLORS = ['#f472b6', '#60a5fa', '#fbbf24', '#a78bfa', '#fb923c', '#2dd4bf'];
    const RAINBOW_COLORS = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6', '#6366f1', '#a855f7'];

    let worms = [];
    let apples = [];
    let player = null;
    let gameOver = false;
    let animId = null;
    let lastSpawnTime = 0;

    const input = { left: false, right: false };

    function getTurnInput() {
      if (input.left && !input.right) return -1;
      if (input.right && !input.left) return 1;
      return 0;
    }

    function setTurn(dir, active) {
      if (dir === 'left') input.left = active;
      if (dir === 'right') input.right = active;
      document.getElementById('btnLeft').classList.toggle('active', input.left);
      document.getElementById('btnRight').classList.toggle('active', input.right);
    }

    function bindTurnButton(btn, dir) {
      const start = (e) => { e.preventDefault(); setTurn(dir, true); };
      const stop = () => setTurn(dir, false);
      btn.addEventListener('pointerdown', start);
      btn.addEventListener('pointerup', stop);
      btn.addEventListener('pointerleave', stop);
      btn.addEventListener('pointercancel', stop);
    }

    function bindKeyboard() {
      const keyMap = {
        ArrowLeft: 'left',
        ArrowRight: 'right',
        a: 'left',
        A: 'left',
        d: 'right',
        D: 'right'
      };

      window.addEventListener('keydown', (e) => {
        const dir = keyMap[e.key];
        if (!dir) return;
        e.preventDefault();
        setTurn(dir, true);
      });

      window.addEventListener('keyup', (e) => {
        const dir = keyMap[e.key];
        if (!dir) return;
        e.preventDefault();
        setTurn(dir, false);
      });

      window.addEventListener('blur', () => {
        setTurn('left', false);
        setTurn('right', false);
      });
    }

    function rand(min, max) { return Math.random() * (max - min) + min; }
    function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
    function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }

    class Worm {
      constructor(x, y, color, isPlayer = false) {
        this.segments = [];
        this.color = color;
        this.isPlayer = isPlayer;
        this.angle = rand(0, Math.PI * 2);
        this.speed = BASE_SPEED;
        this.alive = true;
        this.applesEaten = 0;
        this.aiTarget = null;
        this.aiTimer = 0;
        this.pendingGrowth = 0;
        this.rainbowOffset = 0;

        for (let i = 0; i < 3; i++) {
          this.segments.push({
            x: x - Math.cos(this.angle) * i * SEGMENT_DIST,
            y: y - Math.sin(this.angle) * i * SEGMENT_DIST
          });
        }
      }

      get length() { return this.segments.length; }
      get head() { return this.segments[0]; }

      getSegmentColor(index) {
        if (!this.isPlayer) return this.color;
        return RAINBOW_COLORS[(index + Math.floor(this.rainbowOffset)) % RAINBOW_COLORS.length];
      }

      grow(n = 1) {
        this.pendingGrowth = (this.pendingGrowth || 0) + n;
      }

      update() {
        if (!this.alive) return;

        if (this.isPlayer) {
          const turn = getTurnInput();
          if (turn !== 0) {
            this.angle += turn * TURN_SPEED;
          }
          this.rainbowOffset += 0.08;
        } else {
          this.updateAI();
        }

        const head = this.head;
        const nx = head.x + Math.cos(this.angle) * this.speed;
        const ny = head.y + Math.sin(this.angle) * this.speed;

        const margin = HEAD_RADIUS;
        if (nx < margin || nx > W - margin || ny < margin || ny > H - margin) {
          this.angle += Math.PI;
        }

        const newHead = {
          x: Math.max(margin, Math.min(W - margin, nx)),
          y: Math.max(margin, Math.min(H - margin, ny))
        };

        this.segments.unshift(newHead);

        for (let i = 1; i < this.segments.length; i++) {
          const prev = this.segments[i - 1];
          const curr = this.segments[i];
          const d = dist(prev.x, prev.y, curr.x, curr.y);
          if (d > SEGMENT_DIST) {
            const ratio = (d - SEGMENT_DIST) / d;
            curr.x += (prev.x - curr.x) * ratio;
            curr.y += (prev.y - curr.y) * ratio;
          }
        }

        if (this.pendingGrowth > 0) {
          this.pendingGrowth--;
        } else if (this.segments.length > 3) {
          this.segments.pop();
        }
      }

      updateAI() {
        this.aiTimer--;
        if (this.aiTimer <= 0 || !this.aiTarget) {
          this.aiTimer = randInt(60, 180);
          if (apples.length > 0 && Math.random() < 0.7) {
            this.aiTarget = apples[randInt(0, apples.length - 1)];
          } else {
            this.aiTarget = { x: rand(50, W - 50), y: rand(50, H - 50) };
          }
        }

        const head = this.head;
        const tx = this.aiTarget.x ?? this.aiTarget.segments?.[0]?.x ?? W / 2;
        const ty = this.aiTarget.y ?? this.aiTarget.segments?.[0]?.y ?? H / 2;
        const targetAngle = Math.atan2(ty - head.y, tx - head.x);
        let diff = targetAngle - this.angle;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        this.angle += Math.sign(diff) * Math.min(Math.abs(diff), TURN_SPEED * 0.8);

        for (const w of worms) {
          if (w === this || !w.alive) continue;
          if (this.length > w.length * 1.1) {
            const d = dist(head.x, head.y, w.head.x, w.head.y);
            if (d < 200) {
              this.aiTarget = w;
              this.aiTimer = 30;
              break;
            }
          }
        }
      }

      draw() {
        if (!this.alive) return;
        const head = this.head;

        for (let i = this.segments.length - 1; i >= 1; i--) {
          const seg = this.segments[i];
          ctx.beginPath();
          ctx.arc(seg.x, seg.y, BODY_RADIUS, 0, Math.PI * 2);
          ctx.fillStyle = this.getSegmentColor(i);
          ctx.fill();
        }

        if (this.segments.length > 1) {
          for (let i = this.segments.length - 1; i >= 2; i--) {
            ctx.strokeStyle = this.getSegmentColor(i);
            ctx.lineWidth = BODY_RADIUS * 2;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(this.segments[i].x, this.segments[i].y);
            ctx.lineTo(this.segments[i - 1].x, this.segments[i - 1].y);
            ctx.stroke();
          }
        }

        ctx.beginPath();
        ctx.arc(head.x, head.y, HEAD_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = this.getSegmentColor(0);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.lineWidth = 2;
        ctx.stroke();

        const eyeOff = HEAD_RADIUS * 0.4;
        const ex1 = head.x + Math.cos(this.angle - 0.5) * eyeOff;
        const ey1 = head.y + Math.sin(this.angle - 0.5) * eyeOff;
        const ex2 = head.x + Math.cos(this.angle + 0.5) * eyeOff;
        const ey2 = head.y + Math.sin(this.angle + 0.5) * eyeOff;

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(ex1, ey1, 3, 0, Math.PI * 2);
        ctx.arc(ex2, ey2, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#1a1a2e';
        ctx.beginPath();
        ctx.arc(ex1 + Math.cos(this.angle) * 1.5, ey1 + Math.sin(this.angle) * 1.5, 1.5, 0, Math.PI * 2);
        ctx.arc(ex2 + Math.cos(this.angle) * 1.5, ey2 + Math.sin(this.angle) * 1.5, 1.5, 0, Math.PI * 2);
        ctx.fill();

        if (this.isPlayer) {
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 11px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(this.length, head.x, head.y - HEAD_RADIUS - 6);
        }
      }

      die() {
        this.alive = false;
        const count = Math.max(3, Math.floor(this.length * 0.6));
        for (let i = 0; i < count; i++) {
          const seg = this.segments[Math.floor(i * this.segments.length / count)] || this.head;
          apples.push({
            x: seg.x + rand(-15, 15),
            y: seg.y + rand(-15, 15),
            r: 7
          });
        }
      }
    }


    function spawnApple() {
      apples.push({
        x: rand(30, W - 30),
        y: rand(30, H - 30),
        r: 7 + rand(0, 2)
      });
    }

    function initGame() {
      worms = [];
      apples = [];
      gameOver = false;
      document.getElementById('overlay').classList.remove('show');

      for (let i = 0; i < APPLE_COUNT; i++) spawnApple();

      const positions = [
        { x: W * 0.3, y: H * 0.5 },
        { x: W * 0.7, y: H * 0.3 },
        { x: W * 0.5, y: H * 0.7 }
      ];

      player = new Worm(positions[0].x, positions[0].y, null, true);
      worms.push(player);

      for (let i = 1; i < INITIAL_WORMS; i++) {
        const pos = positions[i];
        worms.push(new Worm(pos.x, pos.y, COLORS[(i - 1) % COLORS.length]));
      }

      lastSpawnTime = Date.now();
      updateHUD();
    }

    function spawnNewWorm() {
      let x, y, safe = false;
      for (let attempt = 0; attempt < 30; attempt++) {
        x = rand(80, W - 80);
        y = rand(80, H - 80);
        safe = true;
        for (const w of worms) {
          if (w.alive && dist(x, y, w.head.x, w.head.y) < 120) {
            safe = false;
            break;
          }
        }
        if (safe) break;
      }
      if (!safe) return;

      const color = COLORS[randInt(0, COLORS.length - 1)];
      worms.push(new Worm(x, y, color));
    }

    function updateHUD() {
      document.getElementById('length').textContent = player ? player.length : 0;
      document.getElementById('apples').textContent = player ? player.applesEaten : 0;
      document.getElementById('alive').textContent = worms.filter(w => w.alive).length;
    }

    function checkCollisions() {
      for (const worm of worms) {
        if (!worm.alive) continue;
        const head = worm.head;

        for (let i = apples.length - 1; i >= 0; i--) {
          const a = apples[i];
          if (dist(head.x, head.y, a.x, a.y) < HEAD_RADIUS + a.r) {
            worm.grow(2);
            worm.applesEaten++;
            apples.splice(i, 1);
            spawnApple();
          }
        }

        for (const other of worms) {
          if (other === worm || !other.alive) continue;

          for (let i = 0; i < other.segments.length; i += 2) {
            const seg = other.segments[i];
            const sr = i === 0 ? HEAD_RADIUS : BODY_RADIUS;
            const d = dist(head.x, head.y, seg.x, seg.y);

            if (d < HEAD_RADIUS + sr - 2) {
              if (worm.length > other.length * 1.15) {
                other.die();
                worm.grow(Math.floor(other.length * 0.5));
              } else if (worm.length < other.length * 0.85) {
                worm.die();
                if (worm.isPlayer) endGame(false);
              }
              break;
            }
          }
        }
      }

      if (player && !player.alive) endGame(false);
    }

    function endGame(won) {
      gameOver = true;
      const overlay = document.getElementById('overlay');
      document.getElementById('overlayTitle').textContent = won ? '🎉 승리!' : '💀 게임 오버';
      document.getElementById('overlayMsg').textContent = won
        ? `최종 길이 ${player.length}, 사과 ${player.applesEaten}개!`
        : `길이 ${player.length}, 사과 ${player.applesEaten}개 먹었습니다.`;
      overlay.classList.add('show');
    }

    function drawBackground() {
      ctx.fillStyle = '#16213e';
      ctx.fillRect(0, 0, W, H);

      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }
      for (let y = 0; y < H; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }
    }

    function drawApple(a) {
      ctx.beginPath();
      ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
      ctx.fillStyle = '#ef4444';
      ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.beginPath();
      ctx.arc(a.x - a.r * 0.2, a.y - a.r * 0.2, a.r * 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#22c55e';
      ctx.beginPath();
      ctx.moveTo(a.x, a.y - a.r);
      ctx.quadraticCurveTo(a.x + 5, a.y - a.r - 8, a.x + 3, a.y - a.r - 4);
      ctx.fill();
    }

    function gameLoop() {
      if (gameOver) return;

      drawBackground();

      for (const a of apples) drawApple(a);

      for (const worm of worms) worm.update();
      checkCollisions();

      const sorted = [...worms].sort((a, b) => a.length - b.length);
      for (const worm of sorted) worm.draw();

      updateHUD();

      const now = Date.now();
      if (now - lastSpawnTime >= SPAWN_INTERVAL_MS) {
        spawnNewWorm();
        lastSpawnTime = now;
      }

      animId = requestAnimationFrame(gameLoop);
    }

    canvas.style.cursor = 'default';

    bindTurnButton(document.getElementById('btnLeft'), 'left');
    bindTurnButton(document.getElementById('btnRight'), 'right');
    bindKeyboard();

    document.getElementById('restartBtn').addEventListener('click', () => {
      cancelAnimationFrame(animId);
      initGame();
      gameLoop();
    });

    initGame();
    gameLoop();
  </script>
</body>
</html>
