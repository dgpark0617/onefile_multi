<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>코지월드 3D</title>
  <style>* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  font-family: "Segoe UI", system-ui, sans-serif;
  color: #5a4a42;
  background: #f3ecf7;
}
.hidden { display: none !important; }

#lobby {
  height: 100dvh;
  max-height: 100dvh;
  padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow-y: auto;
}
#lobby h1 {
  font-size: clamp(1.35rem, 5vw, 1.7rem);
  color: #c45d7a;
}
#lobby .sub { color: #8a7a73; font-size: 0.88rem; line-height: 1.5; }
.hint {
  background: rgba(255,255,255,0.7);
  border: 1px solid rgba(255,255,255,0.9);
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 0.8rem;
  color: #7a6a63;
  line-height: 1.5;
}
.mode-block {
  background: rgba(255,255,255,0.75);
  border: 1px solid rgba(255,255,255,0.95);
  border-radius: 14px;
  padding: 14px;
}
.mode-block h2 { margin: 0 0 6px; font-size: 0.95rem; color: #6a5a52; }
.mode-block p { margin: 0 0 10px; font-size: 0.78rem; color: #8a7a73; line-height: 1.45; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
button {
  border: none; border-radius: 10px; padding: 10px 14px; font-size: 0.85rem;
  cursor: pointer; touch-action: manipulation;
}
.btn-green { background: #7cbc6e; color: #fff; }
.btn-primary { background: #e08aa3; color: #fff; }
.btn-ghost { background: #e8dfd6; color: #5a4a42; }
input {
  width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #e0d5cc;
  background: #fff; color: #5a4a42; font-size: 0.9rem; margin-bottom: 8px;
}
#roomBox, #waitingBox {
  background: #fff;
  padding: 12px;
  border-radius: 10px;
  font-size: 0.82rem;
  border: 1px solid #f0c9d4;
  word-break: break-all;
}
#inviteLink { color: #c45d7a; font-size: 0.78rem; display: block; margin: 8px 0; word-break: break-all; }
#rosterList { margin: 8px 0; padding: 0; list-style: none; line-height: 1.7; font-size: 0.85rem; }
#log { font-size: 0.75rem; color: #7cbc6e; max-height: 64px; overflow-y: auto; white-space: pre-wrap; }

#gameShell {
  position: fixed; inset: 0;
  background: #f3ecf7;
}
#gameMount { position: absolute; inset: 0; }
#backBtn {
  position: absolute; top: 10px; left: 10px; z-index: 20;
  font-size: 0.78rem; padding: 7px 12px;
}

#hint {
  position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
  background: rgba(255,255,255,0.75); backdrop-filter: blur(4px);
  padding: 8px 18px; border-radius: 20px;
  color: #7a6a63; font-size: 13px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  pointer-events: none; z-index: 15;
}
#minimapWrap {
  position: fixed; top: 14px; right: 14px;
  width: 150px; height: 150px; border-radius: 50%;
  overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.18);
  border: 3px solid rgba(255,255,255,0.85);
  background: #cdeec1; z-index: 15;
}
#minimap { width: 100%; height: 100%; display:block; }
#joyPad {
  position: fixed; left: 26px; bottom: 30px;
  width: 108px; height: 108px; border-radius: 50%;
  background: rgba(255,255,255,0.45);
  border: 2px solid rgba(255,255,255,0.8);
  box-shadow: 0 4px 14px rgba(0,0,0,0.1);
  touch-action: none; z-index: 15;
}
#joyKnob {
  position: absolute; left: 50%; top: 50%;
  width: 46px; height: 46px; border-radius: 50%;
  background: rgba(247,201,214,0.9);
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  transform: translate(-50%, -50%);
  pointer-events: none;
}
#camHint {
  position: fixed; right: 26px; bottom: 30px;
  background: rgba(255,255,255,0.6); backdrop-filter: blur(4px);
  padding: 8px 14px; border-radius: 16px;
  color: #7a6a63; font-size: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  pointer-events: none; line-height: 1.5; text-align: right; z-index: 15;
}
#settingsBtn {
  position: fixed; top: 14px; right: 14px; margin-top: 164px;
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(255,255,255,0.8); backdrop-filter: blur(4px);
  border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  font-size: 18px; cursor: pointer; z-index: 16;
  display: flex; align-items: center; justify-content: center;
}
#settingsPanel {
  position: fixed; top: 178px; right: 14px;
  width: 220px; background: rgba(255,255,255,0.88); backdrop-filter: blur(6px);
  border-radius: 16px; padding: 16px 18px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  color: #6a5a52; font-size: 13px;
  display: none; z-index: 17;
}
#settingsPanel.open { display: block; }
#settingsPanel h3 { margin: 0 0 12px; font-size: 14px; color: #5a4a42; }
.setRow { margin-bottom: 12px; }
.setRow label { display:flex; justify-content: space-between; margin-bottom: 4px; }
.setRow input[type=range] { width: 100%; accent-color: #f7a8b8; margin: 0; }
#resetBtn {
  width: 100%; padding: 7px; border: none; border-radius: 10px;
  background: #f7c9d6; color: #6a3a44; font-size: 12px; cursor: pointer;
}
#netBadge {
  position: fixed; top: 52px; left: 50%; transform: translateX(-50%);
  background: rgba(255,255,255,0.8); padding: 4px 12px; border-radius: 12px;
  font-size: 11px; color: #8a7a73; z-index: 15; pointer-events: none;
}

@media (max-width: 600px) {
  #hint { font-size: 11px; padding: 6px 12px; top: 10px; max-width: 78%; }
  #minimapWrap { width: 92px; height: 92px; top: 10px; right: 10px; border-width: 2px; }
  #settingsBtn { width: 32px; height: 32px; font-size: 14px; margin-top: 104px; top: 10px; right: 10px; }
  #settingsPanel { top: 108px; right: 10px; width: 168px; padding: 12px 14px; font-size: 11px; }
  #joyPad { width: 82px; height: 82px; left: 18px; bottom: 22px; }
  #joyKnob { width: 34px; height: 34px; }
  #camHint { font-size: 10px; padding: 6px 10px; right: 18px; bottom: 22px; }
}
</style>
</head>
<body>
<div id="lobby">
    <h1>🌸 코지월드 3D</h1>
    <p class="sub">파스텔 오픈월드 · 초대코드 멀티 · 위치 동기화</p>
    <div class="hint">
      솔로로 바로 놀거나, 방을 만들어 친구코드를 공유하세요.<br />
      같은 WiFi/네트워크에서 PeerJS로 만나요.
    </div>

    <div class="mode-block">
      <h2>솔로</h2>
      <p>혼자 산책</p>
      <button class="btn-green" id="btnSolo" type="button">시작하기</button>
    </div>

    <div class="mode-block">
      <h2>멀티 — 방장</h2>
      <p>6자 초대코드 생성</p>
      <button class="btn-primary" id="btnHost" type="button">방 만들기</button>
      <div id="roomBox" class="hidden" style="margin-top:10px">
        <div>코드: <strong id="roomCodeText">-</strong></div>
        <a id="inviteLink" href="#" target="_blank" rel="noopener"></a>
        <div class="btn-row" style="margin-top:8px">
          <button class="btn-ghost" id="btnCopyCode" type="button">코드 복사</button>
          <button class="btn-ghost" id="btnCopyLink" type="button">링크 복사</button>
        </div>
        <ul id="rosterList"></ul>
      </div>
    </div>

    <div class="mode-block">
      <h2>멀티 — 참가</h2>
      <p>초대코드 입력</p>
      <input id="joinCodeInput" placeholder="예: a3k9mx" autocomplete="off" />
      <input id="roomInput" class="hidden" />
      <button class="btn-primary" id="btnJoin" type="button">입장</button>
      <div id="waitingBox" class="hidden" style="margin-top:8px">연결 대기 중…</div>
    </div>

    <div id="log"></div>
  </div>

  <div id="gameShell" class="hidden">
    <div id="gameMount"></div>
    <button type="button" id="backBtn" class="btn-ghost">← 로비</button>
    <div id="hint">왼쪽 패드로 이동 · 드래그로 카메라 · 휠/핀치 줌</div>
    <div id="netBadge"></div>
    <div id="minimapWrap"><canvas id="minimap"></canvas></div>
    <div id="joyPad"><div id="joyKnob"></div></div>
    <div id="camHint">드래그: 카메라<br>스크롤: 줌</div>
    <button id="settingsBtn" type="button">🎨</button>
    <div id="settingsPanel">
      <h3>색감 설정</h3>
      <div class="setRow">
        <label><span>채도</span><span id="satVal">125%</span></label>
        <input type="range" id="satSlider" min="30" max="220" value="125" />
      </div>
      <div class="setRow">
        <label><span>밝기</span><span id="briVal">100%</span></label>
        <input type="range" id="briSlider" min="60" max="150" value="100" />
      </div>
      <div class="setRow">
        <label><span>대비</span><span id="conVal">112%</span></label>
        <input type="range" id="conSlider" min="60" max="150" value="112" />
      </div>
      <div class="setRow">
        <label><span>톤 노출</span><span id="expVal">1.0</span></label>
        <input type="range" id="expSlider" min="60" max="180" value="100" />
      </div>
      <button id="resetBtn" type="button">기본값으로 초기화</button>
    </div>
  </div>
