<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>포트나이트 타워</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #111; font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
    canvas { display: block; width: 100vw; height: 100dvh; touch-action: none; cursor: crosshair; }
    #hud {
      position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px;
      background: rgba(0, 0, 0, 0.72); padding: 10px 14px; border-radius: 10px;
      border: 2px solid #f5c518; line-height: 1.75; font-size: clamp(0.72rem, 2.8vw, 0.88rem); z-index: 5;
    }
    #hud span { color: #f5c518; font-weight: bold; }
    #crosshair {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 20px; height: 20px; pointer-events: none; z-index: 5;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: #fff; box-shadow: 0 0 4px #000;
    }
    #crosshair::before { width: 2px; height: 20px; left: 9px; }
    #crosshair::after { width: 20px; height: 2px; top: 9px; }
    #towerBar {
      position: fixed; top: max(10px, env(safe-area-inset-top)); right: 10px;
      width: 22px; height: min(180px, 28dvh); background: rgba(0, 0, 0, 0.65);
      border: 2px solid #f5c518; border-radius: 10px; overflow: hidden; z-index: 5;
    }
    #towerFill { width: 100%; background: linear-gradient(0deg, #f5c518, #ff6b00); position: absolute; bottom: 0; height: 0%; }
    #popup {
      position: fixed; top: 38%; left: 50%; transform: translate(-50%, -50%);
      font-size: clamp(1rem, 4vw, 1.5rem); color: #f5c518; text-shadow: 0 0 10px #000;
      opacity: 0; transition: opacity 0.3s; z-index: 6; pointer-events: none;
    }
    #popup.show { opacity: 1; }
    #screen {
      position: fixed; inset: 0; z-index: 20;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      background: rgba(0, 0, 0, 0.88); padding: 20px;
    }
    #screen.hide { display: none; }
    h1 {
      font-size: clamp(1.4rem, 5vw, 2.1rem); color: #f5c518; margin-bottom: 10px; text-align: center;
    }
    .desc {
      color: #aaa; text-align: center; line-height: 1.85; margin-bottom: 22px;
      max-width: 420px; font-size: clamp(0.82rem, 3vw, 0.95rem);
    }
    .start {
      padding: 14px 36px; font-size: 1.05rem; background: #f5c518; color: #111;
      border: none; border-radius: 10px; font-weight: bold; cursor: pointer; touch-action: manipulation;
    }
    #ctrl {
      position: fixed; bottom: max(10px, env(safe-area-inset-bottom)); left: 50%;
      transform: translateX(-50%); color: #777; font-size: 0.74rem; z-index: 5; text-align: center;
    }
    #mobCtrl { position: fixed; inset: 0; pointer-events: none; z-index: 4; display: none; }
    #mobCtrl.show { display: block; }
    .mbtn {
      position: absolute; pointer-events: auto; border-radius: 14px;
      border: 2px solid rgba(245, 197, 24, 0.6); background: rgba(0, 0, 0, 0.45);
      color: #f5c518; font-size: 0.72rem; font-weight: bold;
      display: flex; align-items: center; justify-content: center; touch-action: none; user-select: none;
    }
    .mbtn.active { background: rgba(245, 197, 24, 0.25); }
    #padMove { left: 14px; bottom: max(14px, env(safe-area-inset-bottom)); width: 110px; height: 110px; border-radius: 50%; }
    #padFire { right: 14px; bottom: max(14px, env(safe-area-inset-bottom)); width: 68px; height: 68px; }
    #padBuild { right: 92px; bottom: max(18px, calc(env(safe-area-inset-bottom) + 4px)); width: 60px; height: 60px; }
    #padJump { right: 162px; bottom: max(22px, calc(env(safe-area-inset-bottom) + 8px)); width: 54px; height: 54px; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div>🏗️ 높이 <span id="height">0</span>m / <span id="goal">30</span>m</div>
    <div>🧱 자재 <span id="mat">200</span></div>
    <div>❤️ HP <span id="hp">100</span></div>
    <div>💀 좀비 <span id="zombies">0</span> · 🎯 <span id="kills">0</span></div>
  </div>
  <div id="crosshair"></div>
  <div id="towerBar"><div id="towerFill"></div></div>
  <div id="popup"></div>
  <div id="ctrl">WASD 이동 · 좌클릭 총 · 우클릭 블록 · 스페이스 점프 · 마우스 시점</div>

  <div id="mobCtrl">
    <div class="mbtn" id="padMove">이동</div>
    <div class="mbtn" id="padJump">점프</div>
    <div class="mbtn" id="padBuild">블록</div>
    <div class="mbtn" id="padFire">총</div>
  </div>

  <div id="screen">
    <h1>🏗️ 포트나이트 타워</h1>
    <p class="desc">
      FPS로 좀비를 막고, <b style="color:#f5c518">블록을 쌓아</b> 타워 꼭대기까지!<br><br>
      <b>좌클릭</b> 발사 · <b>우클릭</b> 조준한 곳에 블록 1칸<br>
      WASD 이동 · 스페이스 점프
    </p>
    <button type="button" class="start" id="go">게임 시작</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x6eb5ff);
    scene.fog = new THREE.Fog(0x6eb5ff, 40, 120);

    const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 200);
    const raycaster = new THREE.Raycaster();

    const B = 1;
    const TOWER_H = 30;
    const GOAL_Y = TOWER_H + 1;
    const REACH = 5.5;

    const blocks = new Map();
    const blockMeshes = [];
    const playerBuilds = new Set();
    const zombies = [];
    const keys = {};
    const touch = { moveX: 0, moveZ: 0, jump: false, fire: false, build: false };

    let yaw = 0, pitch = 0, locked = false, running = false;
    let hp = 100, kills = 0, mat = 200, spawnT = 0, shootCd = 0, buildCd = 0;
    let player, vel, grounded;

    const towerMat = new THREE.MeshLambertMaterial({ color: 0x8899aa });
    const buildMat = new THREE.MeshLambertMaterial({ color: 0x4a9eff, transparent: true, opacity: 0.9 });
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x3d8b37 });

    function resize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    }
    addEventListener('resize', resize);

    function key(x, y, z) { return `${x | 0},${y | 0},${z | 0}`; }
    function hasBlock(x, y, z) { return blocks.has(key(x, y, z)); }

    function addBlock(x, y, z, material, isTower) {
      const k = key(x, y, z);
      if (blocks.has(k)) return null;
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(B, B, B), material);
      mesh.position.set(x + 0.5, y + 0.5, z + 0.5);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.userData.block = { x: x | 0, y: y | 0, z: z | 0, tower: !!isTower };
      scene.add(mesh);
      blocks.set(k, mesh);
      blockMeshes.push(mesh);
      if (!isTower) playerBuilds.add(k);
      return mesh;
    }

    function removePlayerBuilds() {
      for (const k of [...playerBuilds]) {
        const mesh = blocks.get(k);
        if (mesh) {
          scene.remove(mesh);
          blocks.delete(k);
          const i = blockMeshes.indexOf(mesh);
          if (i >= 0) blockMeshes.splice(i, 1);
        }
      }
      playerBuilds.clear();
    }

    function buildTower() {
      const R = 3;
      for (let y = 1; y <= TOWER_H; y++) {
        for (let x = -R; x <= R; x++) {
          for (let z = -R; z <= R; z++) {
            if (Math.abs(x) === R || Math.abs(z) === R) addBlock(x, y, z, towerMat, true);
          }
        }
      }
      for (let x = -R + 1; x < R; x++) {
        for (let z = -R + 1; z < R; z++) {
          addBlock(x, TOWER_H, z, towerMat, true);
        }
      }
      const crown = new THREE.Mesh(
        new THREE.OctahedronGeometry(1.1),
        new THREE.MeshLambertMaterial({ color: 0xf5c518 })
      );
      crown.position.set(0.5, TOWER_H + 2, 0.5);
      scene.add(crown);
    }

    function initGround() {
      for (let x = -20; x < 20; x++) {
        for (let z = -20; z < 20; z++) {
          if (Math.abs(x) < 4 && Math.abs(z) < 4) continue;
          addBlock(x, 0, z, groundMat, true);
        }
      }
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(4, 4.5, 32),
        new THREE.MeshBasicMaterial({ color: 0xf5c518, side: THREE.DoubleSide })
      );
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = 0.02;
      scene.add(ring);
    }

    function initLights() {
      scene.add(new THREE.AmbientLight(0xffffff, 0.62));
      const sun = new THREE.DirectionalLight(0xfff0cc, 0.9);
      sun.position.set(30, 50, 20);
      sun.castShadow = true;
      scene.add(sun);
    }

    function createPlayer() {
      player = new THREE.Object3D();
      player.position.set(8, 2, 0);
      vel = new THREE.Vector3();
      grounded = false;
      scene.add(player);
    }

    function floorAt(x, z) {
      const fx = Math.floor(x), fz = Math.floor(z);
      let top = 0;
      for (const [k, mesh] of blocks) {
        const { x: bx, y: by, z: bz } = mesh.userData.block;
        if (bx === fx && bz === fz && by + 1 > top) top = by + 1;
      }
      return top;
    }

    function collide() {
      const px = player.position.x, pz = player.position.z;
      const hw = 0.3, hh = 1.65;
      let py = player.position.y;
      grounded = false;

      for (const mesh of blocks.values()) {
        const bx = mesh.userData.block.x;
        const by = mesh.userData.block.y;
        const bz = mesh.userData.block.z;
        if (px + hw > bx && px - hw < bx + 1 && py + hh > by && py < by + 1 && pz + hw > bz && pz - hw < bz + 1) {
          if (vel.y <= 0 && py > by + 0.5) { py = by + 1; vel.y = 0; grounded = true; }
          else if (vel.y > 0 && py + hh < by + 1.05) { py = by - hh; vel.y = 0; }
        }
      }

      const gy = floorAt(px, pz);
      if (py <= gy) { py = gy; vel.y = 0; grounded = true; }
      player.position.y = py;
      if (py < -5) { hp = 0; gameOver(); }
    }

    function camDir() {
      const d = new THREE.Vector3();
      camera.getWorldDirection(d);
      return d;
    }

    function raycastVoxel(maxDist) {
      const origin = camera.position.clone();
      const dir = camDir().normalize();
      let t = 0;
      let lx = Math.floor(origin.x), ly = Math.floor(origin.y), lz = Math.floor(origin.z);
      const stepX = dir.x > 0 ? 1 : -1;
      const stepY = dir.y > 0 ? 1 : -1;
      const stepZ = dir.z > 0 ? 1 : -1;
      const tDeltaX = dir.x === 0 ? Infinity : Math.abs(1 / dir.x);
      const tDeltaY = dir.y === 0 ? Infinity : Math.abs(1 / dir.y);
      const tDeltaZ = dir.z === 0 ? Infinity : Math.abs(1 / dir.z);
      let tMaxX = dir.x === 0 ? Infinity : ((dir.x > 0 ? lx + 1 : lx) - origin.x) / dir.x;
      let tMaxY = dir.y === 0 ? Infinity : ((dir.y > 0 ? ly + 1 : ly) - origin.y) / dir.y;
      let tMaxZ = dir.z === 0 ? Infinity : ((dir.z > 0 ? lz + 1 : lz) - origin.z) / dir.z;
      let nx = 0, ny = 0, nz = 0;

      while (t < maxDist) {
        if (hasBlock(lx, ly, lz)) {
          return { hit: true, x: lx, y: ly, z: lz, nx, ny, nz };
        }
        if (tMaxX < tMaxY) {
          if (tMaxX < tMaxZ) { t = tMaxX; tMaxX += tDeltaX; lx += stepX; nx = -stepX; ny = nz = 0; }
          else { t = tMaxZ; tMaxZ += tDeltaZ; lz += stepZ; nz = -stepZ; nx = ny = 0; }
        } else {
          if (tMaxY < tMaxZ) { t = tMaxY; tMaxY += tDeltaY; ly += stepY; ny = -stepY; nx = nz = 0; }
          else { t = tMaxZ; tMaxZ += tDeltaZ; lz += stepZ; nz = -stepZ; nx = ny = 0; }
        }
      }
      return { hit: false };
    }

    function playerBoxIntersects(ix, iy, iz) {
      const px = player.position.x, py = player.position.y, pz = player.position.z;
      const hw = 0.32, hh = 1.65;
      return px + hw > ix && px - hw < ix + 1 &&
             py + hh > iy && py < iy + 1 &&
             pz + hw > iz && pz - hw < iz + 1;
    }

    function tryPlaceBlock() {
      if (buildCd > 0 || mat < 1) {
        if (mat < 1) popup('자재 부족!');
        return;
      }
      const hit = raycastVoxel(REACH);
      let px, py, pz;
      if (hit.hit) {
        px = hit.x + hit.nx;
        py = hit.y + hit.ny;
        pz = hit.z + hit.nz;
      } else {
        const p = camera.position.clone().add(camDir().clone().multiplyScalar(3.2));
        px = Math.floor(p.x);
        py = Math.floor(p.y);
        pz = Math.floor(p.z);
      }
      if (hasBlock(px, py, pz) || playerBoxIntersects(px, py, pz)) return;
      if (camera.position.distanceTo(new THREE.Vector3(px + 0.5, py + 0.5, pz + 0.5)) > REACH + 0.5) return;
      addBlock(px, py, pz, buildMat, false);
      mat--;
      buildCd = 0.12;
      document.getElementById('mat').textContent = Math.floor(mat);
      popup('🧱');
    }

    function shoot() {
      if (shootCd > 0) return;
      shootCd = 0.22;
      const origin = camera.position.clone();
      const dir = camDir();
      raycaster.set(origin, dir);
      const hits = raycaster.intersectObjects(zombies.map(z => z.mesh), true);
      for (const hit of hits) {
        if (hit.distance > 80) break;
        let node = hit.object;
        while (node) {
          const z = zombies.find(zz => zz.mesh === node);
          if (z) {
            z.hp -= 34;
            popup('쮹!');
            if (z.hp <= 0) {
              scene.remove(z.mesh);
              zombies.splice(zombies.indexOf(z), 1);
              kills++;
            }
            return;
          }
          node = node.parent;
        }
      }
      const flash = new THREE.Mesh(
        new THREE.SphereGeometry(0.06),
        new THREE.MeshBasicMaterial({ color: 0xffee00 })
      );
      flash.position.copy(origin);
      scene.add(flash);
      const end = origin.clone().add(dir.clone().multiplyScalar(40));
      let life = 0.06;
      const tick = () => {
        life -= 0.016;
        flash.position.lerp(end, 0.35);
        if (life > 0) requestAnimationFrame(tick);
        else scene.remove(flash);
      };
      tick();
    }

    function spawnZombie() {
      const a = Math.random() * Math.PI * 2;
      const d = 14 + Math.random() * 10;
      const x = player.position.x + Math.cos(a) * d;
      const z = player.position.z + Math.sin(a) * d;
      const g = new THREE.Group();
      g.position.set(x, floorAt(x, z) + 0.1, z);
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.7, 1.1, 0.5),
        new THREE.MeshLambertMaterial({ color: 0x2d6b2d })
      );
      body.position.y = 0.55;
      g.add(body);
      const head = new THREE.Mesh(
        new THREE.BoxGeometry(0.5, 0.5, 0.5),
        new THREE.MeshLambertMaterial({ color: 0x3d8b3d })
      );
      head.position.y = 1.2;
      g.add(head);
      scene.add(g);
      zombies.push({ mesh: g, hp: 30, spd: 2.5 + Math.random() * 0.8, cd: 0 });
    }

    function updateZombies(dt) {
      for (let i = zombies.length - 1; i >= 0; i--) {
        const z = zombies[i];
        const dx = player.position.x - z.mesh.position.x;
        const dz = player.position.z - z.mesh.position.z;
        const dist = Math.hypot(dx, dz) || 1;
        z.mesh.position.x += (dx / dist) * z.spd * dt;
        z.mesh.position.z += (dz / dist) * z.spd * dt;
        z.mesh.position.y = floorAt(z.mesh.position.x, z.mesh.position.z) + 0.1;
        z.mesh.lookAt(player.position.x, z.mesh.position.y, player.position.z);
        z.cd -= dt;
        if (dist < 1.3 && z.cd <= 0) {
          z.cd = 0.9;
          hp -= 7;
          document.getElementById('hp').textContent = hp;
          if (hp <= 0) gameOver();
        }
        if (z.hp <= 0) {
          scene.remove(z.mesh);
          zombies.splice(i, 1);
        }
      }
    }

    function popup(t) {
      const el = document.getElementById('popup');
      el.textContent = t;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 500);
    }

    function updateHUD() {
      const h = Math.max(0, player.position.y | 0);
      document.getElementById('height').textContent = h;
      document.getElementById('zombies').textContent = zombies.length;
      document.getElementById('kills').textContent = kills;
      document.getElementById('towerFill').style.height = Math.min(100, (h / GOAL_Y) * 100) + '%';
      if (h >= GOAL_Y) win();
    }

    function win() {
      if (!running) return;
      running = false;
      document.exitPointerLock?.();
      document.getElementById('screen').classList.remove('hide');
      document.querySelector('#screen h1').textContent = '🎉 타워 정복!';
      document.querySelector('.desc').innerHTML = `${GOAL_Y}m 도달! · 좀비 ${kills}마리 처치`;
      document.getElementById('go').textContent = '다시 하기';
    }

    function gameOver() {
      if (!running) return;
      running = false;
      document.exitPointerLock?.();
      document.getElementById('screen').classList.remove('hide');
      document.querySelector('#screen h1').textContent = '💀 게임 오버';
      document.querySelector('.desc').textContent = `높이 ${player.position.y | 0}m · 처치 ${kills}`;
      document.getElementById('go').textContent = '다시 하기';
    }

    function moveFlat() {
      const f = new THREE.Vector3(0, 0, -1).applyEuler(new THREE.Euler(0, yaw, 0, 'YXZ'));
      f.y = 0;
      f.normalize();
      const r = new THREE.Vector3(1, 0, 0).applyEuler(new THREE.Euler(0, yaw, 0, 'YXZ'));
      return { f, r };
    }

    let lastT = 0;
    function loop(t) {
      if (!running) return;
      requestAnimationFrame(loop);
      const dt = Math.min((t - lastT) / 1000, 0.05);
      lastT = t;

      const spd = 6.8;
      const { f, r } = moveFlat();
      vel.x = vel.z = 0;
      if (keys.KeyW || touch.moveZ < 0) vel.add(f.clone().multiplyScalar(spd));
      if (keys.KeyS || touch.moveZ > 0) vel.add(f.clone().multiplyScalar(-spd));
      if (keys.KeyA || touch.moveX < 0) vel.add(r.clone().multiplyScalar(-spd));
      if (keys.KeyD || touch.moveX > 0) vel.add(r.clone().multiplyScalar(spd));
      if ((keys.Space || touch.jump) && grounded) { vel.y = 8.5; grounded = false; }
      vel.y -= 21 * dt;
      player.position.add(vel.clone().multiplyScalar(dt));
      collide();

      camera.position.copy(player.position);
      camera.position.y += 1.62;
      camera.rotation.order = 'YXZ';
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;

      shootCd -= dt;
      buildCd -= dt;
      if (touch.fire && shootCd <= 0) shoot();
      if (touch.build && buildCd <= 0) tryPlaceBlock();

      spawnT -= dt;
      if (spawnT <= 0) {
        spawnT = 3;
        spawnZombie();
        if (kills > 3) spawnZombie();
      }
      updateZombies(dt);
      updateHUD();
      renderer.render(scene, camera);
    }

    function start() {
      zombies.forEach(z => scene.remove(z.mesh));
      zombies.length = 0;
      removePlayerBuilds();
      hp = 100;
      kills = 0;
      mat = 200;
      spawnT = 1.2;
      shootCd = 0;
      buildCd = 0;
      player.position.set(8, 2, 0);
      vel.set(0, 0, 0);
      yaw = 0;
      pitch = 0;
      document.getElementById('hp').textContent = 100;
      document.getElementById('mat').textContent = mat;
      document.getElementById('screen').classList.add('hide');
      document.querySelector('#screen h1').textContent = '🏗️ 포트나이트 타워';
      document.getElementById('go').textContent = '게임 시작';
      running = true;
      lastT = performance.now();
      requestAnimationFrame(loop);
      canvas.requestPointerLock?.();
    }

    initLights();
    initGround();
    buildTower();
    createPlayer();
    renderer.render(scene, camera);

    document.getElementById('go').onclick = start;
    document.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'KeyQ') tryPlaceBlock();
    });
    document.addEventListener('keyup', e => { keys[e.code] = false; });
    document.addEventListener('mousemove', e => {
      if (!locked) return;
      yaw -= e.movementX * 0.0022;
      pitch -= e.movementY * 0.0022;
      pitch = Math.max(-1.4, Math.min(1.4, pitch));
    });
    document.addEventListener('mousedown', e => {
      if (!running) return;
      if (e.button === 0) shoot();
      if (e.button === 2) { e.preventDefault(); tryPlaceBlock(); }
    });
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('pointerlockchange', () => {
      locked = document.pointerLockElement === canvas;
    });
    canvas.addEventListener('click', () => {
      if (running && !locked) canvas.requestPointerLock?.();
    });

    if ('ontouchstart' in window) {
      document.getElementById('mobCtrl').classList.add('show');
      document.getElementById('ctrl').textContent = '이동 · 점프 · 블록 · 총 · 드래그로 시점';
      const pad = document.getElementById('padMove');
      let padId = null, padCx = 0, padCy = 0;
      pad.addEventListener('pointerdown', e => {
        padId = e.pointerId;
        const r = pad.getBoundingClientRect();
        padCx = r.left + r.width / 2;
        padCy = r.top + r.height / 2;
        pad.setPointerCapture(padId);
        movePad(e.clientX, e.clientY);
      });
      pad.addEventListener('pointermove', e => {
        if (e.pointerId === padId) movePad(e.clientX, e.clientY);
      });
      function endPad(e) {
        if (e.pointerId !== padId) return;
        padId = null;
        touch.moveX = touch.moveZ = 0;
        pad.classList.remove('active');
      }
      pad.addEventListener('pointerup', endPad);
      pad.addEventListener('pointercancel', endPad);
      function movePad(cx, cy) {
        const dx = cx - padCx, dy = cy - padCy;
        const len = Math.hypot(dx, dy) || 1;
        const max = 40;
        const k = Math.min(1, max / len);
        touch.moveX = (dx * k) / max;
        touch.moveZ = (dy * k) / max;
        pad.classList.toggle('active', len > 8);
      }
      const bindBtn = (el, k, pulse) => {
        el.addEventListener('pointerdown', e => {
          e.preventDefault();
          touch[k] = true;
          el.classList.add('active');
          if (pulse && k === 'build') tryPlaceBlock();
        });
        const off = () => { touch[k] = false; el.classList.remove('active'); };
        el.addEventListener('pointerup', off);
        el.addEventListener('pointerleave', off);
      };
      bindBtn(document.getElementById('padJump'), 'jump', false);
      bindBtn(document.getElementById('padFire'), 'fire', false);
      bindBtn(document.getElementById('padBuild'), 'build', true);
      let lookId = null, lx = 0, ly = 0;
      canvas.addEventListener('pointerdown', e => {
        if (e.target.closest('.mbtn')) return;
        lookId = e.pointerId;
        lx = e.clientX;
        ly = e.clientY;
      });
      canvas.addEventListener('pointermove', e => {
        if (e.pointerId !== lookId) return;
        yaw -= (e.clientX - lx) * 0.004;
        pitch -= (e.clientY - ly) * 0.004;
        pitch = Math.max(-1.4, Math.min(1.4, pitch));
        lx = e.clientX;
        ly = e.clientY;
      });
      canvas.addEventListener('pointerup', e => { if (e.pointerId === lookId) lookId = null; });
    }
  </script>
</body>
</html>
