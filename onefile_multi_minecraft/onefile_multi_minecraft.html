<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포트나이트 타워</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{overflow:hidden;background:#111;font-family:'Segoe UI',sans-serif;color:#fff}
    canvas{display:block;width:100vw;height:100vh}
    #ui{position:fixed;inset:0;pointer-events:none;z-index:5}
    #hud{position:fixed;top:14px;left:14px;background:rgba(0,0,0,.7);padding:12px 16px;border-radius:10px;border:2px solid #f5c518;line-height:1.8;font-size:.9rem}
    #hud span{color:#f5c518;font-weight:bold}
    #crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:24px;height:24px}
    #crosshair::before,#crosshair::after{content:'';position:absolute;background:#fff;box-shadow:0 0 4px #000}
    #crosshair::before{width:2px;height:24px;left:11px}
    #crosshair::after{width:24px;height:2px;top:11px}
    #buildBar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;pointer-events:auto}
    .bbtn{width:70px;height:70px;border:3px solid #555;border-radius:12px;background:rgba(0,0,0,.8);color:#fff;font-size:.75rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
    .bbtn kbd{background:#333;padding:2px 6px;border-radius:4px;font-size:.85rem}
    .bbtn.on{border-color:#f5c518;box-shadow:0 0 16px rgba(245,197,24,.5)}
    #towerBar{position:fixed;top:14px;right:14px;width:24px;height:200px;background:rgba(0,0,0,.6);border:2px solid #f5c518;border-radius:12px;overflow:hidden}
    #towerFill{width:100%;background:linear-gradient(0deg,#f5c518,#ff6b00);position:absolute;bottom:0;transition:height .3s}
    #towerLabel{position:fixed;top:220px;right:10px;font-size:.75rem;color:#f5c518;text-align:center;width:40px}
    #popup{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);font-size:1.6rem;color:#f5c518;text-shadow:0 0 10px #000;opacity:0;transition:opacity .3s}
    #popup.show{opacity:1}
    #screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.85);pointer-events:auto}
    #screen.hide{display:none}
    h1{font-size:2.2rem;color:#f5c518;margin-bottom:10px;text-shadow:0 0 20px rgba(245,197,24,.5)}
    .desc{color:#aaa;text-align:center;line-height:2;margin-bottom:24px;max-width:460px}
    .start{padding:16px 40px;font-size:1.2rem;background:#f5c518;color:#111;border:none;border-radius:10px;font-weight:bold;cursor:pointer}
    .start:hover{background:#ffe066}
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="ui">
    <div id="hud">
      <div>🏗️ 높이: <span id="height">0</span>m / <span id="goal">30</span>m</div>
      <div>❤️ HP: <span id="hp">100</span></div>
      <div>💀 좀비: <span id="zombies">0</span></div>
      <div>🎯 처치: <span id="kills">0</span></div>
    </div>
    <div id="crosshair"></div>
    <div id="towerBar"><div id="towerFill" style="height:0%"></div></div>
    <div id="towerLabel">타워</div>
    <div id="buildBar">
      <div class="bbtn on" data-mode="wall"><kbd>Q</kbd>벽</div>
      <div class="bbtn" data-mode="floor"><kbd>E</kbd>발판</div>
      <div class="bbtn" data-mode="ramp"><kbd>R</kbd>계단</div>
      <div class="bbtn" data-mode="shoot"><kbd>좌클릭</kbd>총</div>
    </div>
    <div id="popup"></div>
  </div>

  <div id="screen">
    <h1>🏗️ 포트나이트 타워</h1>
    <p class="desc">
      가운데 <b style="color:#f5c518">거대 타워</b> 꼭대기까지 올라가세요!<br>
      Q 벽 · E 발판 · R 계단 — 포트나이트 빌드<br>
      좀비를 쮹쮹 쏘면서 타워를 올라가!<br><br>
      WASD 이동 · 스페이스 점프 · 마우스 시점<br>
      클릭해서 게임 시작
    </p>
    <button class="start" id="go">게임 시작!</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x6eb5ff);
    scene.fog = new THREE.Fog(0x6eb5ff, 40, 120);

    const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 200);
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(0, 0);

    const B = 1;
    const TOWER_H = 30;
    const GOAL_Y = TOWER_H * B + 1;
    const builds = new Map();
    const towerBlocks = new Set();
    const zombies = [];
    const bullets = [];
    const keys = {};
    let yaw = 0, pitch = 0, locked = false, running = false;
    let hp = 100, kills = 0, buildMode = 'wall', mat = 200;
    let player, vel, grounded, spawnT = 0;

    const buildMat = new THREE.MeshLambertMaterial({ color: 0x4a9eff, transparent: true, opacity: 0.85 });
    const towerMat = new THREE.MeshLambertMaterial({ color: 0x8899aa });
    const towerAccent = new THREE.MeshLambertMaterial({ color: 0xf5c518 });
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x3d8b37 });

    function bk(x,y,z){return `${x|0},${y|0},${z|0}`}
    function occupied(x,y,z){return builds.has(bk(x,y,z))||towerBlocks.has(bk(x,y,z))}

    function addBox(x,y,z,mat,group,isTower){
      const m=new THREE.Mesh(new THREE.BoxGeometry(B,B,B),mat);
      m.position.set(x+.5,y+.5,z+.5);
      m.castShadow=true;m.receiveShadow=true;
      m.userData={bx:x|0,by:y|0,bz:z|0};
      group.add(m);
      const k=bk(x,y,z);
      if(isTower) towerBlocks.add(k); else builds.set(k,m);
      return m;
    }

    function buildTowerFixed(){
      const g=new THREE.Group();scene.add(g);
      const R=3;
      for(let y=1;y<=TOWER_H;y++){
        for(let x=-R;x<=R;x++)for(let z=-R;z<=R;z++){
          const wall=Math.abs(x)===R||Math.abs(z)===R;
          if(wall) addBox(x,y,z,towerMat,g,true);
          if(y%5===0&&Math.abs(x)<R&&Math.abs(z)<R) addBox(x,y,z,new THREE.MeshLambertMaterial({color:0x556677}),g,true);
        }
      }
      for(let y=1;y<TOWER_H;y++){
        if(y%2===0){addBox(2,y,1,towerMat,g,true);addBox(1,y,2,new THREE.MeshLambertMaterial({color:0x3a4a5a}),g,true);}
      }
      const crown=new THREE.Mesh(new THREE.OctahedronGeometry(1.2),towerAccent);
      crown.position.set(.5,TOWER_H+2,.5);g.add(crown);
      const pl=new THREE.PointLight(0xffaa00,3,40);
      pl.position.set(.5,TOWER_H+2,.5);g.add(pl);
    }

    function initGround(){
      const g=new THREE.Group();
      for(let x=-20;x<20;x++)for(let z=-20;z<20;z++){
        if(Math.abs(x)<4&&Math.abs(z)<4) continue;
        addBox(x,0,z,groundMat,g,false);
      }
      scene.add(g);
      const ring=new THREE.Mesh(new THREE.RingGeometry(4,4.5,32),new THREE.MeshBasicMaterial({color:0xf5c518,side:2}));
      ring.rotation.x=-Math.PI/2;ring.position.y=.02;scene.add(ring);
    }

    function initLights(){
      scene.add(new THREE.AmbientLight(0xffffff,.6));
      const sun=new THREE.DirectionalLight(0xfff0cc,.9);
      sun.position.set(30,50,20);sun.castShadow=true;
      sun.shadow.mapSize.set(1024,1024);scene.add(sun);
    }

    function createPlayer(){
      player=new THREE.Object3D();
      player.position.set(7,2,0);
      vel=new THREE.Vector3();grounded=false;
      scene.add(player);
    }

    function getHeight(x,z){
      let h=0;
      const check=(k,set)=>{
        if(!set.has(k))return;
        const p=k.split(',');const by=+p[1];
        if(by+1>h)h=by+1;
      };
      const fx=Math.floor(x),fz=Math.floor(z);
      for(let dy=0;dy<=TOWER_H+5;dy++){
        check(bk(fx,dy,fz),towerBlocks);
        check(bk(fx,dy,fz),new Set(builds.keys()));
      }
      for(const k of builds.keys()){
        const p=k.split(',');
        if(+p[0]===fx&&+p[2]===fz&&+p[1]+1>h)h=+p[1]+1;
      }
      for(const k of towerBlocks){
        const p=k.split(',');
        if(+p[0]===fx&&+p[2]===fz&&+p[1]+1>h)h=+p[1]+1;
      }
      return h;
    }

    function collide(){
      const px=player.position.x,pz=player.position.z;
      const hw=.35,hh=1.7;
      grounded=false;
      let py=player.position.y;

      const allKeys=[...builds.keys(),...towerBlocks];
      for(const k of allKeys){
        const[bx,by,bz]=k.split(',').map(Number);
        if(px+hw>bx&&px-hw<bx+1&&py+hh>by&&py<by+1&&pz+hw>bz&&pz-hw<bz+1){
          if(vel.y<=0&&py>by+1-.3){py=by+1;vel.y=0;grounded=true;}
          else if(vel.y>0&&py+hh<by+1+.3){py=by-hh;vel.y=0;}
        }
      }
      const gh=getHeight(px,pz);
      if(py<=gh){py=gh;vel.y=0;grounded=true;}
      player.position.y=py;
      if(py<-5){hp=0;gameOver();}
    }

    function forward(){
      const v=new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(pitch,yaw,0,'YXZ'));
      v.y=0;v.normalize();return v;
    }
    function right(){
      const v=new THREE.Vector3(1,0,0).applyEuler(new THREE.Euler(0,yaw,0,'YXZ'));
      v.y=0;return v;
    }

    function placeBuild(mode){
      if(mat<=0){popup('자재 부족!');return;}
      const f=forward(),r=right();
      const px=player.position.x,py=Math.floor(player.position.y),pz=player.position.z;
      const g=new THREE.Group();let placed=0;

      if(mode==='wall'){
        const wx=Math.floor(px+f.x*3),wy=py,wz=Math.floor(pz+f.z*3);
        const rx=Math.floor(r.x),rz=Math.floor(r.z);
        for(let h=0;h<4;h++)for(let w=-1;w<=1;w++){
          const bx=wx+rx*w,by=wy+h,bz=wz+rz*w;
          if(!occupied(bx,by,bz)){addBox(bx,by,bz,buildMat,scene,false);placed++;}
        }
      } else if(mode==='floor'){
        const fy=py;
        for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++){
          const bx=Math.floor(px)+dx,by=fy,bz=Math.floor(pz)+dz;
          if(!occupied(bx,by,bz)){addBox(bx,by,bz,buildMat,scene,false);placed++;}
        }
      } else if(mode==='ramp'){
        const sx=Math.floor(px+f.x*2),sz=Math.floor(pz+f.z*2);
        for(let i=0;i<5;i++){
          const bx=sx+Math.floor(f.x*i),by=py+i,bz=sz+Math.floor(f.z*i);
          if(!occupied(bx,by,bz)){addBox(bx,by,bz,buildMat,scene,false);placed++;}
          const bx2=bx+Math.floor(r.x),bz2=bz+Math.floor(r.z);
          if(!occupied(bx2,by,bz2)){addBox(bx2,by,bz2,buildMat,scene,false);placed++;}
        }
      }
      if(placed){mat-=placed*.5;popup(mode==='wall'?'🧱 벽!':mode==='floor'?'⬜ 발판!':'📐 계단!');beep(200,.05);}
    }

    function shoot(){
      beep(600,.08,true);
      const dir=new THREE.Vector3();camera.getWorldDirection(dir);
      bullets.push({x:camera.position.x,y:camera.position.y,z:camera.position.z,
        dx:dir.x*50,dy:dir.y*50,dz:dir.z*50,life:2,
        mesh:(()=>{const m=new THREE.Mesh(new THREE.SphereGeometry(.1),new THREE.MeshBasicMaterial({color:0xffee00}));
          m.position.copy(camera.position);scene.add(m);return m;})()});
    }

    function spawnZombie(){
      const a=Math.random()*Math.PI*2,d=18+Math.random()*8;
      const x=player.position.x+Math.cos(a)*d,z=player.position.z+Math.sin(a)*d;
      const g=new THREE.Group();
      g.position.set(x,getHeight(x,z)+.1,z);
      const body=new THREE.Mesh(new THREE.BoxGeometry(.7,1.1,.5),new THREE.MeshLambertMaterial({color:0x2d6b2d}));
      body.position.y=.55;g.add(body);
      const head=new THREE.Mesh(new THREE.BoxGeometry(.5,.5,.5),new THREE.MeshLambertMaterial({color:0x3d8b3d}));
      head.position.y=1.2;g.add(head);
      scene.add(g);
      zombies.push({mesh:g,hp:30,spd:2.5+Math.random(),cd:0});
    }

    function updateZombies(dt){
      for(let i=zombies.length-1;i>=0;i--){
        const z=zombies[i];
        const dx=player.position.x-z.mesh.position.x,dz=player.position.z-z.mesh.position.z;
        const dist=Math.hypot(dx,dz)||1;
        z.mesh.position.x+=(dx/dist)*z.spd*dt;
        z.mesh.position.z+=(dz/dist)*z.spd*dt;
        z.mesh.position.y=getHeight(z.mesh.position.x,z.mesh.position.z)+.1;
        z.mesh.lookAt(player.position.x,z.mesh.position.y,player.position.z);
        z.cd-=dt;
        if(dist<1.5&&z.cd<=0){z.cd=1;hp-=8;document.getElementById('hp').textContent=hp;if(hp<=0)gameOver();}
        if(z.hp<=0){scene.remove(z.mesh);zombies.splice(i,1);kills++;}
      }
    }

    function updateBullets(dt){
      for(let i=bullets.length-1;i>=0;i--){
        const b=bullets[i];
        b.x+=b.dx*dt;b.y+=b.dy*dt;b.z+=b.dz*dt;
        b.mesh.position.set(b.x,b.y,b.z);
        b.life-=dt;
        for(const z of zombies){
          if(z.hp<=0)continue;
          if(Math.hypot(b.x-z.mesh.position.x,b.y-z.mesh.position.y-1,b.z-z.mesh.position.z)<1.2){
            z.hp-=30;b.life=0;popup('쮹!');break;
          }
        }
        if(b.life<=0){scene.remove(b.mesh);bullets.splice(i,1);}
      }
    }

    function popup(t){
      const el=document.getElementById('popup');
      el.textContent=t;el.classList.add('show');
      setTimeout(()=>el.classList.remove('show'),700);
    }

    function beep(f,d,zap){
      try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();
        o.connect(g);g.connect(c.destination);
        o.frequency.value=f;g.gain.value=.12;
        if(zap){o.frequency.exponentialRampToValueAtTime(100,c.currentTime+d);}
        o.start();o.stop(c.currentTime+d);}catch(e){}
    }

    function updateHUD(){
      const h=Math.max(0,player.position.y|0);
      document.getElementById('height').textContent=h;
      document.getElementById('zombies').textContent=zombies.length;
      document.getElementById('kills').textContent=kills;
      document.getElementById('towerFill').style.height=Math.min(100,h/GOAL_Y*100)+'%';
      if(h>=GOAL_Y) win();
    }

    function win(){
      running=false;document.exitPointerLock?.();
      document.getElementById('screen').classList.remove('hide');
      document.querySelector('#screen h1').textContent='🎉 타워 정복!';
      document.querySelector('.desc').innerHTML=`${GOAL_Y}m 꼭대기 도달!<br>좀비 ${kills}마리 처치!`;
      document.getElementById('go').textContent='다시 하기';
    }

    function gameOver(){
      running=false;document.exitPointerLock?.();
      document.getElementById('screen').classList.remove('hide');
      document.querySelector('#screen h1').textContent='💀 게임 오버';
      document.querySelector('.desc').textContent=`${player.position.y|0}m까지 올라감 · 처치 ${kills}`;
      document.getElementById('go').textContent='다시 하기';
    }

    let lt=0;
    function loop(t){
      if(!running)return;
      requestAnimationFrame(loop);
      const dt=Math.min((t-lt)/1000,.05);lt=t;
      const spd=7;
      const f=forward(),rt=right();
      vel.x=vel.z=0;
      if(keys.KeyW)vel.add(f.clone().multiplyScalar(spd));
      if(keys.KeyS)vel.add(f.clone().multiplyScalar(-spd));
      if(keys.KeyA)vel.add(rt.clone().multiplyScalar(-spd));
      if(keys.KeyD)vel.add(rt.clone().multiplyScalar(spd));
      if((keys.Space||keys.jump)&&grounded){vel.y=9;grounded=false;}
      vel.y-=22*dt;
      player.position.add(vel.clone().multiplyScalar(dt));
      collide();

      camera.position.copy(player.position);camera.position.y+=1.65;
      camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;

      spawnT-=dt;
      if(spawnT<=0){spawnT=2.5;spawnZombie();if(kills>5)spawnZombie();}
      updateZombies(dt);updateBullets(dt);updateHUD();
      renderer.render(scene,camera);
    }

    function start(){
      zombies.forEach(z=>scene.remove(z.mesh));zombies.length=0;
      bullets.forEach(b=>scene.remove(b.mesh));bullets.length=0;
      builds.forEach(m=>scene.remove(m));builds.clear();
      hp=100;kills=0;mat=200;spawnT=1;
      player.position.set(7,2,0);vel.set(0,0,0);yaw=0;pitch=0;
      document.getElementById('hp').textContent=100;
      document.getElementById('screen').classList.add('hide');
      document.querySelector('#screen h1').textContent='🏗️ 포트나이트 타워';
      document.getElementById('go').textContent='게임 시작!';
      running=true;lt=performance.now();
      requestAnimationFrame(loop);
      canvas.requestPointerLock();
    }

    initLights();initGround();buildTowerFixed();createPlayer();
    renderer.render(scene,camera);

    document.getElementById('go').onclick=start;
    document.addEventListener('keydown',e=>{
      keys[e.code]=true;
      if(e.code==='KeyQ'){buildMode='wall';setBuildUI();placeBuild('wall');}
      if(e.code==='KeyE'){buildMode='floor';setBuildUI();placeBuild('floor');}
      if(e.code==='KeyR'){buildMode='ramp';setBuildUI();placeBuild('ramp');}
    });
    document.addEventListener('keyup',e=>keys[e.code]=false);
    document.addEventListener('mousemove',e=>{
      if(!locked)return;yaw-=e.movementX*.002;pitch-=e.movementY*.002;
      pitch=Math.max(-1.4,Math.min(1.4,pitch));
    });
    document.addEventListener('mousedown',e=>{
      if(!running||!locked)return;
      if(e.button===0)shoot();
    });
    document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===canvas;});
    document.querySelectorAll('.bbtn').forEach(b=>{
      b.onclick=()=>{if(b.dataset.mode==='shoot')return;buildMode=b.dataset.mode;setBuildUI();placeBuild(buildMode);};
    });
    function setBuildUI(){document.querySelectorAll('.bbtn').forEach(b=>b.classList.toggle('on',b.dataset.mode===buildMode));}
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
    if('ontouchstart'in window){
      document.getElementById('buildBar').style.bottom='80px';
      addEventListener('touchstart',e=>{if(e.touches[0].clientX<innerWidth/2)keys.jump=true;},{passive:true});
      addEventListener('touchend',()=>keys.jump=false);
    }
  </script>
</body>
</html>
