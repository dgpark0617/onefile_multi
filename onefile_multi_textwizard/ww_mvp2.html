<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Word Wizard MVP</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #111;
    font-family: monospace;
    touch-action: manipulation;
  }
  #root {
    display: flex;
    flex-direction: column;
    width: 100vw;
    height: 100vh;
  }
  #battlefield {
    flex: 6;
    position: relative;
    background: #0a0a12;
    overflow: hidden;
  }
  #keyboard {
    flex: 4;
    display: flex;
    flex-direction: column;
    background: #1a1a1a;
    border-top: 2px solid #333;
  }
  canvas { display: block; width: 100%; height: 100%; }

  #hud {
    position: absolute; top: 6px; left: 6px;
    color: #0f0; font-size: 14px; z-index: 5;
    background: rgba(0,0,0,0.4); padding: 4px 8px; border-radius: 4px;
  }
  #bufferDisplay {
    position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 22px; letter-spacing: 4px;
    background: rgba(0,0,0,0.5); padding: 6px 14px; border-radius: 6px;
    min-width: 80px; text-align: center; z-index: 5;
  }

  .padRow { flex: 1; display: flex; }
  .padBtn {
    flex: 1; margin: 4px; border: none; border-radius: 8px;
    background: #333; color: #fff; font-size: 18px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none;
    active-opacity: 0.5;
  }
  .padBtn:active { background: #555; }
  .padBtn.enter { background: #2d6a2d; }
  .padBtn.enter:active { background: #3d8a3d; }
  .padBtn.clear { background: #6a2d2d; }
  .padBtn.clear:active { background: #8a3d3d; }

  #perkRow { display: flex; background: #111; padding: 4px; gap: 4px; align-items: center; justify-content: center; }
  #perkRow span { color: #888; font-size: 12px; }

  #waveHud {
    position: absolute; top: 6px; right: 6px;
    color: #ffcc00; font-size: 13px; z-index: 5; text-align: right;
    background: rgba(0,0,0,0.4); padding: 4px 8px; border-radius: 4px;
  }

  #upgradeOverlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.75);
    display: none; /* JS로 flex 전환 */
    flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 20;
  }
  #upgradeOverlay.show { display: flex; }
  #upgradeOverlay h2 { color: #fff; margin: 0 0 14px; font-size: 18px; }
  #upgradeChoices { display: flex; gap: 10px; }
  .upgradeCard {
    width: 90px; padding: 12px 6px; border-radius: 10px;
    background: #222; border: 2px solid #444; color: #fff;
    text-align: center; font-size: 13px;
  }
  .upgradeCard:active { background: #444; }
</style>
</head>
<body>
<div id="root">
  <div id="battlefield">
    <canvas id="fieldCanvas"></canvas>
    <div id="hud">BOSS HP: <span id="hpVal">100</span></div>
    <div id="waveHud">WAVE <span id="waveVal">1</span><br>처치 <span id="killVal">0</span>/<span id="killTargetVal">8</span></div>
    <div id="bufferDisplay"><span id="bufferText">&nbsp;</span></div>
    <div id="upgradeOverlay">
      <h2>웨이브 클리어! 강화를 선택하세요</h2>
      <div id="upgradeChoices"></div>
    </div>
  </div>
  <div id="keyboard">
    <div id="perkRow"><span id="perkStatus">보유 특성: 없음</span></div>
    <div class="padRow">
      <button class="padBtn" data-word="물">물</button>
      <button class="padBtn" data-word="불">불</button>
      <button class="padBtn" data-word="독">독</button>
    </div>
    <div class="padRow">
      <button class="padBtn" data-word="장">장</button>
      <button class="padBtn" data-word="벽">벽</button>
      <button class="padBtn clear" id="clearBtn">지움</button>
    </div>
    <div class="padRow">
      <button class="padBtn enter" id="enterBtn" style="flex:1">엔터 (발사)</button>
    </div>
  </div>
</div>

<script>
/*
  ===== 웨이브(Wave) / 강화(Upgrade) 단계 분리 계획 =====

  1. 게임 상태(state.gameState)는 두 가지만 존재:
     - 'WAVE'    : 단어가 스폰되고 전투가 진행되는 일반 상태
     - 'UPGRADE' : 웨이브 클리어 직후, 스폰/전투를 멈추고
                   플레이어가 강화 카드 1개를 선택하는 인터럽트 상태

  2. 웨이브 정의(WAVES 배열): 웨이브마다 킬 목표(killTarget),
     스폰 간격(spawnInterval), 등장 단어 풀(wordPool), 단어 속도
     범위(speedMin/Max)를 다르게 주어 난이도를 계단식으로 올림.
     배열 끝에 도달하면 이후 웨이브는 마지막 설정을 기준으로
     계수를 곱해 무한 스케일링.

  3. 웨이브 클리어 조건: killCount(이번 웨이브에서 처치한 단어 수)가
     현재 웨이브의 killTarget에 도달하면 즉시 'UPGRADE'로 전환.
     보스 HP와는 별개 트리거(보스 처치는 별도 승리 조건으로 추후 분리 가능).

  4. 강화 단계 진입 시:
     - 스폰 타이머/단어 이동/미사일 이동 전부 정지(update()에서 gameState 체크로 스킵)
     - getAvailableUpgrades()로 아직 안 찍은 특성 + 스택 가능한 데미지업을
       조합해 후보 풀 구성 후 무작위 3장 뽑아 오버레이에 렌더
     - 카드 선택 시 applyUpgrade()로 state.playerPerks 갱신 →
       오버레이 닫고 killCount 리셋 + waveIndex++ 하며 'WAVE' 복귀

  5. 특성(Perk) 구조 변경:
     - 관통(piercing), 벽반동(bounce): 기존과 동일한 bool
     - 갈래(splitLevel): 0(단발) → 1(2갈래) → 2(3갈래) 단계별 업그레이드로 변경
       (기존 split2/split3 별개 bool → 단일 레벨 값으로 단순화)
     - 데미지(dmgLevel): 상한 없이 반복 선택 가능한 스택형 강화,
       미사일 명중당 보스 데미지 = 5 + dmgLevel*3
*/
(function(){
  const canvas = document.getElementById('fieldCanvas');
  const ctx = canvas.getContext('2d');
  const battlefield = document.getElementById('battlefield');
  const bufferText = document.getElementById('bufferText');
  const hpVal = document.getElementById('hpVal');
  const waveVal = document.getElementById('waveVal');
  const killVal = document.getElementById('killVal');
  const killTargetVal = document.getElementById('killTargetVal');
  const perkStatus = document.getElementById('perkStatus');
  const upgradeOverlay = document.getElementById('upgradeOverlay');
  const upgradeChoices = document.getElementById('upgradeChoices');

  // ---- 화면 크기 대응 ----
  function resize() {
    canvas.width = battlefield.clientWidth;
    canvas.height = battlefield.clientHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- 핵심 상태 (State) ----
  const state = {
    inputBuffer: "",
    gameState: 'WAVE', // 'WAVE' | 'UPGRADE'
    waveIndex: 0,
    killCount: 0,
    playerPerks: {
      piercing: false,
      bounce: false,
      splitLevel: 0,   // 0=단발, 1=2갈래, 2=3갈래
      dmgLevel: 0       // 스택형, 명중 데미지 = 5 + dmgLevel*3
    }
  };

  // 웨이브 설정: 단계별로 스폰 간격/속도/단어풀이 세짐
  const WAVES = [
    { killTarget: 8,  spawnInterval: 70, wordPool: ["물", "불"],                 speedMin: 0.6, speedMax: 1.2 },
    { killTarget: 12, spawnInterval: 60, wordPool: ["물", "불", "독"],           speedMin: 0.7, speedMax: 1.4 },
    { killTarget: 16, spawnInterval: 50, wordPool: ["물", "불", "독", "장"],     speedMin: 0.8, speedMax: 1.6 },
    { killTarget: 20, spawnInterval: 45, wordPool: ["물", "불", "독", "장", "벽"], speedMin: 0.9, speedMax: 1.8 }
  ];
  function getWaveConfig(index) {
    if (index < WAVES.length) return WAVES[index];
    // 배열 끝 이후: 마지막 설정 기준으로 계수를 곱해 무한 스케일링
    const base = WAVES[WAVES.length - 1];
    const extra = index - WAVES.length + 1;
    return {
      killTarget: base.killTarget + extra * 4,
      spawnInterval: Math.max(20, base.spawnInterval - extra * 3),
      wordPool: base.wordPool,
      speedMin: base.speedMin + extra * 0.1,
      speedMax: base.speedMax + extra * 0.1
    };
  }

  // ---- 엔티티 ----
  const player = { w: 30, h: 20 };
  const boss = { hp: 100, maxHp: 100 };

  let words = [];      // 낙하 단어 { text, x, y, speed }
  let missiles = [];    // 발사체 { x, y, vx, vy, text }
  let particles = [];   // splice 즉시 소멸이라 사실상 미사용 (레이어 자리만 예약)

  const WORD_POOL = ["물", "불", "독", "장", "벽"]; // 전체 풀(참고용, 실제 스폰은 웨이브별 wordPool 사용)
  let wordIdCounter = 0;

  function spawnWord() {
    const cfg = getWaveConfig(state.waveIndex);
    const text = cfg.wordPool[Math.floor(Math.random() * cfg.wordPool.length)];
    words.push({
      id: wordIdCounter++,
      text,
      x: Math.random() * (canvas.width - 40) + 20,
      y: -20,
      speed: cfg.speedMin + Math.random() * (cfg.speedMax - cfg.speedMin)
    });
  }
  let spawnTimer = 0;

  // 같은 텍스트를 가진, 아직 안 맞은 단어들 중 화면 아래쪽(가장 급한 것)부터 타겟팅
  function findTargets(text, count) {
    const candidates = words.filter(w => w.text === text && !w.hit);
    candidates.sort((a, b) => b.y - a.y);
    return candidates.slice(0, count);
  }

  // ---- 입력 버퍼 처리 ----
  function appendChar(ch) {
    state.inputBuffer += ch;
    updateBufferDisplay();
  }
  function clearBuffer() {
    state.inputBuffer = "";
    updateBufferDisplay();
  }
  function updateBufferDisplay() {
    bufferText.textContent = state.inputBuffer.length ? state.inputBuffer : "\u00A0";
  }

  function fireMissile() {
    const text = state.inputBuffer;
    if (!text) return;

    const baseX = canvas.width / 2;
    const baseY = canvas.height - player.h - 10;

    // 갈래(splitLevel): 0=단발, 1=2갈래, 2=3갈래
    let count = 1;
    let spread = 0;
    if (state.playerPerks.splitLevel === 2) { count = 3; spread = 1.6; }
    else if (state.playerPerks.splitLevel === 1) { count = 2; spread = 1.2; }

    // 같은 글자를 쓴 낙하 단어가 있으면 그쪽으로 유도(호밍) 타겟 배정
    const targets = findTargets(text, count);

    for (let i = 0; i < count; i++) {
      let vx = 0;
      if (count > 1) {
        const t = (i / (count - 1)) - 0.5; // -0.5 ~ 0.5
        vx = t * spread * 2;
      }
      const target = targets[i] || targets[0] || null;
      if (target) {
        const dx = target.x - baseX;
        const dy = target.y - baseY;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        vx = (dx / dist) * 4.5;
      }
      missiles.push({
        x: baseX, y: baseY,
        vx: vx,
        vy: target ? (target.y - baseY) / (Math.sqrt(Math.pow(target.x-baseX,2)+Math.pow(target.y-baseY,2)) || 1) * 4.5 : -4,
        text: text,
        targetId: target ? target.id : null,
        piercing: state.playerPerks.piercing,
        bounce: state.playerPerks.bounce
      });
    }

    clearBuffer();
  }

  // ---- 강화(Upgrade) 단계 ----
  const UPGRADE_DEFS = {
    pierce: { label: "관통", desc: "미사일이 명중 후에도 그대로 관통", available: () => !state.playerPerks.piercing },
    bounce: { label: "벽반동", desc: "미사일이 벽에 부딪히면 반사", available: () => !state.playerPerks.bounce },
    split:  { label: "갈래 강화", desc: () => state.playerPerks.splitLevel === 0 ? "미사일이 2갈래로 발사" : "미사일이 3갈래로 발사", available: () => state.playerPerks.splitLevel < 2 },
    dmg:    { label: "데미지 강화", desc: "명중 데미지 +3 (중복 가능)", available: () => true }
  };

  function getAvailableUpgrades() {
    return Object.keys(UPGRADE_DEFS).filter(key => UPGRADE_DEFS[key].available());
  }

  function pickRandomUpgrades(n) {
    const pool = getAvailableUpgrades();
    // 셔플 후 앞에서 n개
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return pool.slice(0, n);
  }

  function applyUpgrade(key) {
    if (key === 'pierce') state.playerPerks.piercing = true;
    else if (key === 'bounce') state.playerPerks.bounce = true;
    else if (key === 'split') state.playerPerks.splitLevel = Math.min(2, state.playerPerks.splitLevel + 1);
    else if (key === 'dmg') state.playerPerks.dmgLevel += 1;

    updatePerkStatusDisplay();
    hideUpgradeOverlay();

    // 다음 웨이브로 진행
    state.waveIndex += 1;
    state.killCount = 0;
    state.gameState = 'WAVE';
    updateWaveHud();
  }

  function showUpgradeOverlay() {
    state.gameState = 'UPGRADE';
    const choices = pickRandomUpgrades(3);
    upgradeChoices.innerHTML = "";
    choices.forEach(key => {
      const def = UPGRADE_DEFS[key];
      const card = document.createElement('div');
      card.className = 'upgradeCard';
      const descText = typeof def.desc === 'function' ? def.desc() : def.desc;
      card.innerHTML = `<b>${def.label}</b><br><span style="font-size:11px;color:#aaa">${descText}</span>`;
      const handler = (e) => { e.preventDefault(); applyUpgrade(key); };
      card.addEventListener('touchstart', handler, { passive: false });
      card.addEventListener('click', handler);
      upgradeChoices.appendChild(card);
    });
    upgradeOverlay.classList.add('show');
  }

  function hideUpgradeOverlay() {
    upgradeOverlay.classList.remove('show');
  }

  function updatePerkStatusDisplay() {
    const p = state.playerPerks;
    const parts = [];
    if (p.piercing) parts.push("관통");
    if (p.bounce) parts.push("벽반동");
    if (p.splitLevel === 1) parts.push("2갈래");
    if (p.splitLevel === 2) parts.push("3갈래");
    if (p.dmgLevel > 0) parts.push(`데미지+${p.dmgLevel * 3}`);
    perkStatus.textContent = "보유 특성: " + (parts.length ? parts.join(", ") : "없음");
  }

  function updateWaveHud() {
    const cfg = getWaveConfig(state.waveIndex);
    waveVal.textContent = state.waveIndex + 1;
    killVal.textContent = state.killCount;
    killTargetVal.textContent = cfg.killTarget;
  }

  // ---- 버튼 이벤트 (터치 우선) ----
  document.querySelectorAll('.padBtn[data-word]').forEach(btn => {
    const handler = (e) => {
      e.preventDefault();
      appendChar(btn.dataset.word);
    };
    btn.addEventListener('touchstart', handler, { passive: false });
    btn.addEventListener('click', handler);
  });
  ['touchstart','click'].forEach(evt => {
    document.getElementById('clearBtn').addEventListener(evt, e => { e.preventDefault(); clearBuffer(); });
    document.getElementById('enterBtn').addEventListener(evt, e => { e.preventDefault(); fireMissile(); });
  });

  // ---- 충돌 및 물리 업데이트 ----
  function update() {
    // 단어 낙하
    spawnTimer++;
    if (spawnTimer > 70) { spawnWord(); spawnTimer = 0; }

    words.forEach(w => w.y += w.speed);
    // 화면 하단 이탈 단어 제거 (플레이어에게 도달 = 페널티 없음, MVP는 단순 제거)
    words = words.filter(w => w.y < canvas.height + 20);

    // 미사일 이동: 타겟이 살아있으면 매 프레임 방향 재계산(호밍), 없으면 직진 + 벽 반동
    missiles.forEach(m => {
      if (m.targetId !== null) {
        const target = words.find(w => w.id === m.targetId && !w.hit);
        if (target) {
          const dx = target.x - m.x;
          const dy = target.y - m.y;
          const dist = Math.sqrt(dx*dx + dy*dy) || 1;
          const speed = 4.5;
          m.vx = (dx / dist) * speed;
          m.vy = (dy / dist) * speed;
        } else {
          m.targetId = null; // 타겟 소멸 -> 직진 모드로 전환
        }
      }

      m.x += m.vx;
      m.y += m.vy;

      if (m.bounce && m.targetId === null) {
        if (m.x <= 4 || m.x >= canvas.width - 4) {
          m.vx *= -1;
        }
      }
    });

    // 충돌 판정: 미사일 텍스트 === 단어 텍스트
    missiles.forEach(m => {
      words.forEach(w => {
        if (w.hit) return; // 이미 이번 프레임에 처리됨
        const dx = m.x - w.x;
        const dy = m.y - w.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 22 && m.text === w.text) {
          w.hit = true; // 단어는 무조건 소멸 (즉시 splice 대상)
          boss.hp = Math.max(0, boss.hp - 5);
          // 관통: 미사일은 splice 하지 않고 그대로 y -= speed 유지 (즉, 제거 플래그 X)
          if (!m.piercing) {
            m.dead = true;
          }
        }
      });
    });

    words = words.filter(w => !w.hit); // 명중한 단어 즉시 증발 (splice, 이펙트 없음)
    missiles = missiles.filter(m => !m.dead && m.y > -30 && m.y < canvas.height + 30);

    hpVal.textContent = boss.hp;
  }

  // ---- 렌더링 (도형만 사용) ----
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 보스: 빨간 원
    ctx.beginPath();
    ctx.arc(canvas.width/2, 50, 30, 0, Math.PI*2);
    ctx.fillStyle = "#c0392b";
    ctx.fill();

    // 보스 체력바
    ctx.fillStyle = "#333";
    ctx.fillRect(canvas.width/2 - 60, 90, 120, 8);
    ctx.fillStyle = "#e74c3c";
    ctx.fillRect(canvas.width/2 - 60, 90, 120 * (boss.hp / boss.maxHp), 8);

    // 낙하 단어: 텍스트로만
    ctx.font = "bold 18px monospace";
    ctx.textAlign = "center";
    words.forEach(w => {
      ctx.fillStyle = "#f1c40f";
      ctx.fillText(w.text, w.x, w.y);
    });

    // 미사일: 점(arc)
    ctx.fillStyle = "#00e0ff";
    missiles.forEach(m => {
      ctx.beginPath();
      ctx.arc(m.x, m.y, 4, 0, Math.PI*2);
      ctx.fill();
    });

    // 플레이어: 파란 사각형
    ctx.fillStyle = "#2980ff";
    ctx.fillRect(canvas.width/2 - player.w/2, canvas.height - player.h - 10, player.w, player.h);
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
