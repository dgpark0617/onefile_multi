<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>🧙‍♂️ 글자 마법사 MVP (Pretext.js 아키텍처)</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #f1f5f9; font-family: sans-serif; overflow: hidden; }
body { display: flex; flex-direction: column; }

#header {
  flex: 0 0 auto; background: #fff; padding: 6px 12px;
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid #cbd5e1; font-size: 13px; font-weight: bold;
}

#game-container { flex: 1 1 auto; display: flex; flex-direction: column; position: relative; }
#canvas-wrapper { flex: 1 1 auto; position: relative; background: #fff; }
canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }

#input-area { flex: 0 0 auto; padding: 6px; background: #e2e8f0; border-top: 1px solid #cbd5e1; }
#type-input {
  width: 100%; padding: 10px; font-size: 16px; font-weight: bold;
  border: 2px solid #94a3b8; border-radius: 6px; text-align: center; outline: none;
}
body.kb-open #type-input { border-color: #0284c7; }

#start-screen {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(255,255,255,0.95); z-index: 10;
  display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px;
}
#start-btn { padding: 10px 24px; font-size: 15px; font-weight: bold; background: #0284c7; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>

<div id="header">
  <div>🧙‍♂️ Pretext.js 가성비 엔진 모드</div>
  <div style="font-family: monospace;">SCORE: <span id="score-val">0</span> | HP: <span id="hp-val">100</span></div>
</div>

<div id="game-container">
  <div id="canvas-wrapper">
    <canvas id="gameCanvas"></canvas>
    
    <div id="start-screen">
      <h3 id="screen-title">Word Wizard MVP</h3>
      <button id="start-btn">게임 시작</button>
    </div>
  </div>
  
  <div id="input-area">
    <input type="text" id="type-input" placeholder="단어 입력..." autocomplete="off">
  </div>
</div>

<script>
// ================================================================
// GAME STATE & CONFIG
// ================================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let score = 0;
let gameActive = false;

const lanes = [{ id: 1, name: '일', x: 0 }, { id: 2, name: '이', x: 0 }, { id: 3, name: '삼', x: 0 }];
let player = null;
let boss = null;
let curses = [];
let items = [];
let obstacles = [];
let missiles = [];
let particles = []; 

const WORD_POOL = {
  curse: ['물해', '불독', '암흑', '빙결', '석화'],
  item: ['치유'],
  shield: ['장벽', '결계'],
  boss: ['메테오', '네메시스']
};

// ================================================================
// Pretext.js ENGINE PIPELINE CORE (라이브러리 메커니즘 연동)
// ================================================================
const Pretext = {
  // Phase 1: prepare() - 일회성 세그먼테이션, 자소 분리 및 자모음 캐싱 (Hot Path 오버헤드 완벽 차단)
  prepare: function(text, font) {
    ctx.save();
    ctx.font = font;
    
    const cho = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
    const jung = ["ㅏ","ㅐ","ㅑ","ㅒ","ㅓ","ㅔ","ㅕ","ㅖ","ㅗ","ㅘ","ㅙ","ㅚ","ㅛ","ㅜ","ㅝ","ㅞ","ㅟ","ㅠ","ㅡ","ㅢ","ㅣ"];
    const jong = ["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
    
    let totalWidth = ctx.measureText(text).width;
    let segments = [];
    let currentX = 0;
    
    for (let i = 0; i < text.length; i++) {
      let char = text[i];
      let charW = ctx.measureText(char).width;
      let code = char.charCodeAt(0) - 44032;
      let subFrags = [];
      
      // 유니코드 세그먼테이션 매핑 기반 초중종성 분해
      if (code >= 0 && code <= 11171) {
        let cIdx = Math.floor(code / 588);
        let jIdx = Math.floor((code - (cIdx * 588)) / 28);
        let zIdx = code % 28;
        
        subFrags.push(cho[cIdx]);
        subFrags.push(jung[jIdx]);
        if (jong[zIdx] !== "") subFrags.push(jong[zIdx]);
      } else {
        subFrags.push(char);
      }
      
      segments.push({
        char: char,
        localX: currentX + charW / 2,
        width: charW,
        frags: subFrags // 자소 조각 데이터 사전 캐싱
      });
      currentX += charW;
    }
    
    ctx.restore();
    return { text: text, totalWidth: totalWidth, segments: segments };
  },

  // Phase 2: layout() - 실시간 프레임 연산에서는 DOM 리플로우 없이 오직 순수 산술식으로 배치 정보 추출
  layout: function(handle, containerX, containerY, color) {
    if (!handle || !handle.segments) return;
    let startX = containerX - handle.totalWidth / 2;
    
    handle.segments.forEach((seg) => {
      let worldX = startX + seg.localX;
      
      // 쪼개진 자소 조각 리스트를 루프 돌려 비산 파티클 인덱스 다이렉트 주입
      seg.frags.forEach((frag, fIdx) => {
        let angle = Math.random() * Math.PI * 2;
        let speed = 1.5 + Math.random() * 3.5;
        
        particles.push({
          char: frag,
          x: worldX + (fIdx * 2 - seg.frags.length),
          y: containerY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1, // 분출 반동 구현
          color: color,
          alpha: 1,
          decay: 0.03 + Math.random() * 0.02
        });
      });
    });
  }
};

// ================================================================
// MISSILE & GAME ENGINE SYSTEM
// ================================================================
const MISSILE_TARGET = { BOSS: 'boss', CURSE: 'curse', ITEM: 'item', COVER: 'cover', LANE: 'lane' };

function createMissile({ startX, startY, ttype, targetObj = null, targetPos = null, isShield = false, word = "" }) {
  // 미사일 인스턴스화 시점에 Pretext.prepare()를 1회 실행하여 불변 데이터 캡처
  const handle = Pretext.prepare(word, '12px monospace');
  return { x: startX, y: startY, speed: 8, ttype: ttype, target: targetObj, tpos: targetPos, isShield: isShield, pretextHandle: handle };
}

function updateMissiles() {
  for (let i = missiles.length - 1; i >= 0; i--) {
    let mis = missiles[i];
    let tpos = null;
    let tobj = mis.target;

    if (mis.ttype === MISSILE_TARGET.CURSE && curses.includes(tobj)) tpos = { x: tobj.x, y: tobj.y };
    else if (mis.ttype === MISSILE_TARGET.ITEM && items.includes(tobj)) tpos = { x: tobj.x, y: tobj.y };
    else if (mis.ttype === MISSILE_TARGET.COVER && obstacles.includes(tobj)) tpos = { x: tobj.x + tobj.w / 2, y: tobj.y + tobj.h / 2 };
    else if (mis.ttype === MISSILE_TARGET.LANE) tpos = mis.tpos;
    else if (mis.ttype === MISSILE_TARGET.BOSS) tpos = { x: boss.x + boss.wiggle, y: boss.y };

    if (!tpos) { missiles.splice(i, 1); continue; }

    let dx = tpos.x - mis.x;
    let dy = tpos.y - mis.y;
    let dist = Math.hypot(dx, dy);

    if (dist > mis.speed) {
      mis.x += (dx / dist) * mis.speed;
      mis.y += (dy / dist) * mis.speed;
    } else {
      mis.x = tpos.x; mis.y = tpos.y;
    }

    let blocked = false;
    if (mis.ttype !== MISSILE_TARGET.BOSS) {
      for (let obs of obstacles) {
        if (mis.x > obs.x && mis.x < obs.x + obs.w && mis.y > obs.y && mis.y < obs.y + obs.h) { blocked = true; break; }
      }
    }

    if (blocked) { 
      // 장벽 충돌 시 Pretext.layout 연산 실행하여 조각 분쇄
      Pretext.layout(mis.pretextHandle, mis.x, mis.y, '#64748b');
      missiles.splice(i, 1); 
      continue; 
    }

    if (Math.hypot(mis.x - tpos.x, mis.y - tpos.y) < 10) {
      handleMissileHit(mis, tobj, tpos);
      missiles.splice(i, 1);
    }
  }
}

function handleMissileHit(mis, tobj, tpos) {
  if (mis.ttype === MISSILE_TARGET.CURSE) {
    let idx = curses.indexOf(tobj);
    if (idx !== -1) { 
      // 히트 지점에서 Pretext.layout() 호출을 수행해 산술식 기반 자소 파편 전방위 투사
      Pretext.layout(mis.pretextHandle, tobj.x, tobj.y, '#0284c7');
      Pretext.layout(Pretext.prepare(tobj.word, '12px sans-serif'), tobj.x, tobj.y, '#ef4444');
      curses.splice(idx, 1); 
      score += 10; 
    }
  } 
  else if (mis.ttype === MISSILE_TARGET.ITEM) {
    let idx = items.indexOf(tobj);
    if (idx !== -1) { 
      Pretext.layout(mis.pretextHandle, tobj.x, tobj.y, '#10b981');
      player.hp = Math.min(100, player.hp + 20); 
      items.splice(idx, 1); 
    }
  } 
  else if (mis.ttype === MISSILE_TARGET.COVER) {
    player.x = tpos.x; player.y = tpos.y - 10; player.laneIdx = -1; 
    Pretext.layout(mis.pretextHandle, player.x, player.y, '#0284c7');
  } 
  else if (mis.ttype === MISSILE_TARGET.LANE) {
    player.x = tpos.x; player.y = tpos.y; 
    Pretext.layout(mis.pretextHandle, player.x, player.y, '#0284c7');
  } 
  else if (mis.ttype === MISSILE_TARGET.BOSS) {
    let targetX = boss.x + boss.wiggle;
    if (mis.isShield) {
      if (boss.shieldOn) { 
        Pretext.layout(Pretext.prepare(boss.shieldWord, '13px sans-serif'), targetX, boss.y, '#d97706');
        boss.shieldOn = false; 
        boss.word = getRandomWord('boss'); 
      }
    } else {
      if (!boss.shieldOn) {
        Pretext.layout(Pretext.prepare(boss.word, '13px sans-serif'), targetX, boss.y, '#7c3aed');
        boss.hp -= 34;
        if (boss.hp <= 0) { boss.hp = 0; endGame(true); } 
        else { boss.shieldOn = true; boss.shieldWord = getRandomWord('shield'); boss.word = getRandomWord('boss'); }
      }
    }
  }
  document.getElementById('score-val').innerText = score;
  document.getElementById('hp-val').innerText = player.hp;
}

// ================================================================
// INITIALIZATION & RESIZE
// ================================================================
function initLayout() {
  const wrapper = document.getElementById('canvas-wrapper');
  canvas.width = wrapper.clientWidth;
  canvas.height = wrapper.clientHeight;

  const w = canvas.width, h = canvas.height;
  const laneW = w / 3;
  for (let i = 0; i < 3; i++) lanes[i].x = laneW * i + laneW / 2;

  if (player) { if (player.laneIdx !== -1) player.x = lanes[player.laneIdx].x; player.y = h - 25; }
  if (boss) { boss.x = w / 2; boss.y = h > 350 ? 60 : 40; }
  if (obstacles.length >= 2) {
    obstacles[0].x = laneW - 20; obstacles[0].y = h - 70;
    obstacles[1].x = laneW * 2 - 20; obstacles[1].y = h - 70;
  }
}
window.addEventListener('resize', initLayout);

// ================================================================
// GAME MANAGEMENT
// ================================================================
function getRandomWord(type) { return WORD_POOL[type][Math.floor(Math.random() * WORD_POOL[type].length)]; }

function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  score = 0; document.getElementById('score-val').innerText = '0'; document.getElementById('hp-val').innerText = '100';

  player = { x: 0, y: 0, laneIdx: 1, hp: 100 };
  boss = { x: 0, y: 0, hp: 100, word: getRandomWord('boss'), shieldOn: true, shieldWord: getRandomWord('shield'), wiggle: 0, tick: 0 };
  curses = []; items = []; missiles = []; particles = [];
  obstacles = [{ name: '갑', x: 0, y: 0, w: 40, h: 14 }, { name: '을', x: 0, y: 0, w: 40, h: 14 }];

  initLayout();
  gameActive = true;
  
  scheduleSpawns();
  requestAnimationFrame(gameLoop);
  document.getElementById('type-input').focus();
}

let curseTimer, itemTimer;
function scheduleSpawns() {
  if (curseTimer) clearInterval(curseTimer);
  if (itemTimer) clearInterval(itemTimer);

  // 50% 감속 밸런스에 맞춘 6초/20초 스폰 루프 지연셋
  curseTimer = setInterval(() => {
    if (!gameActive) return;
    let lIdx = Math.floor(Math.random() * 3);
    let speed = canvas.height > 400 ? 0.75 : 0.5; // 저주 유도탄 낙하 속도 절반 감소
    curses.push({ x: lanes[lIdx].x, y: boss.y + 15, speed: speed, word: getRandomWord('curse') });
  }, 6000);

  itemTimer = setInterval(() => {
    if (!gameActive) return;
    let lIdx = Math.floor(Math.random() * 3);
    items.push({ x: lanes[lIdx].x, y: boss.y + 15, speed: 0.6, word: getRandomWord('item') });
  }, 20000);
}

function endGame(win) {
  gameActive = false;
  clearInterval(curseTimer); clearInterval(itemTimer);
  document.getElementById('type-input').blur();
  document.getElementById('screen-title').innerText = win ? "🎉 승리!" : "💀 패배...";
  document.getElementById('start-screen').style.display = 'flex';
}

// ================================================================
// INPUT SYSTEM
// ================================================================
function processInput(val) {
  if (!gameActive) return;

  for (let l of lanes) {
    if (val === l.name) {
      player.laneIdx = l.id - 1;
      missiles.push(createMissile({ startX: player.x, startY: player.y, ttype: MISSILE_TARGET.LANE, targetPos: { x: l.x, y: canvas.height - 25 }, word: val }));
      return;
    }
  }
  for (let obs of obstacles) {
    if (val === obs.name) {
      missiles.push(createMissile({ startX: player.x, startY: player.y, ttype: MISSILE_TARGET.COVER, targetObj: obs, word: val }));
      return;
    }
  }
  for (let c of curses) {
    if (val === c.word) {
      missiles.push(createMissile({ startX: player.x, startY: player.y, ttype: MISSILE_TARGET.CURSE, targetObj: c, word: val }));
      return;
    }
  }
  for (let it of items) {
    if (val === it.word) {
      missiles.push(createMissile({ startX: player.x, startY: player.y, ttype: MISSILE_TARGET.ITEM, targetObj: it, word: val }));
      return;
    }
  }
  if (boss.shieldOn && val === boss.shieldWord) {
    missiles.push(createMissile({ startX: player.x, startY: player.y, ttype: MISSILE_TARGET.BOSS, isShield: true, word: val }));
    return;
  }
  if (!boss.shieldOn && val === boss.word) {
    missiles.push(createMissile({ startX: player.x, startY: player.y, ttype: MISSILE_TARGET.BOSS, isShield: false, word: val }));
    return;
  }
}

// ================================================================
// PHYSICS & RENDERING
// ================================================================
function update() {
  if (!gameActive) return;

  boss.tick++;
  boss.wiggle = Math.sin(boss.tick * 0.02) * 40; // 흔들림 속도 절반 조절

  updateMissiles();

  for (let i = curses.length - 1; i >= 0; i--) {
    let c = curses[i]; c.y += c.speed;
    if (c.y > canvas.height - 10) {
      player.hp -= 15; curses.splice(i, 1);
      if (player.hp <= 0) endGame(false);
    } else if (Math.hypot(c.x - player.x, c.y - player.y) < 20) {
      player.hp -= 20; curses.splice(i, 1);
      if (player.hp <= 0) endGame(false);
    }
    document.getElementById('hp-val').innerText = Math.max(0, player.hp);
  }

  for (let i = items.length - 1; i >= 0; i--) {
    items[i].y += items[i].speed;
    if (items[i].y > canvas.height) items.splice(i, 1);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx; p.y += p.vy; p.alpha -= p.decay;
    if (p.alpha <= 0) particles.splice(i, 1);
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const w = canvas.width, h = canvas.height;

  ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(w/3, 0); ctx.lineTo(w/3, h); ctx.moveTo(w*2/3, 0); ctx.lineTo(w*2/3, h); ctx.stroke();
  ctx.fillStyle = '#94a3b8'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
  lanes.forEach(l => ctx.fillText(`[${l.name}]`, l.x, h - 6));

  if (!gameActive) return;

  obstacles.forEach(o => {
    ctx.fillStyle = '#cbd5e1'; ctx.fillRect(o.x, o.y, o.w, o.h);
    ctx.fillStyle = '#64748b'; ctx.fillText(o.name, o.x + o.w/2, o.y - 3);
  });

  ctx.font = 'bold 12px sans-serif';
  curses.forEach(c => { ctx.fillStyle = '#ef4444'; ctx.fillText(c.word, c.x, c.y); });
  items.forEach(it => { ctx.fillStyle = '#10b981'; ctx.fillText(it.word, it.x, it.y); });

  // 미사일 유도 텍스트 렌더링
  ctx.font = '12px monospace';
  ctx.textAlign = 'center';
  missiles.forEach(m => {
    ctx.fillStyle = m.ttype === 'boss' ? '#7c3aed' : '#0284c7';
    ctx.fillText(m.pretextHandle.text, m.x, m.y);
  });

  // Pretext 캐시 오프셋을 역이용하여 파편화된 한글 자소 렌더링 파트
  ctx.font = 'bold 12px monospace';
  ctx.textAlign = 'center';
  for (let p of particles) {
    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.fillText(p.char, p.x, p.y);
    ctx.restore();
  }

  ctx.fillStyle = '#0284c7'; ctx.fillRect(player.x - 8, player.y - 12, 16, 14);

  let bx = boss.x + boss.wiggle, by = boss.y;
  ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.arc(bx, by, 14, 0, Math.PI*2); ctx.fill();
  ctx.fillRect(bx - 30, by - 20, 60 * (boss.hp / 100), 3);

  ctx.font = 'bold 13px sans-serif';
  if (boss.shieldOn) {
    ctx.fillStyle = '#d97706'; ctx.fillText(`🛡️ ${boss.shieldWord}`, bx, by + 28);
    ctx.fillStyle = '#94a3b8'; ctx.font = '10px sans-serif'; ctx.fillText(`(${boss.word})`, bx, by + 40);
  } else {
    ctx.fillStyle = '#7c3aed'; ctx.fillText(`⚔️ ${boss.word}`, bx, by + 28);
  }
}

function gameLoop() { update(); draw(); if (gameActive) requestAnimationFrame(gameLoop); }

// ================================================================
// SYSTEM EVENTS & CONTROL
// ================================================================
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('type-input').addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    const val = e.target.value.trim();
    if (val) { processInput(val); e.target.value = ''; }
  }
});

function setupViewportHandler() {
  const ti = document.getElementById('type-input');
  ti.addEventListener('focus', () => document.body.classList.add('kb-open'));
  ti.addEventListener('blur', () => document.body.classList.remove('kb-open'));
}
setupViewportHandler();
</script>
</body>
</html>
